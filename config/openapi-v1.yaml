  /admin/backup/download/{filename}:
    parameters:
      - in: path
        name: filename
        required: true
        schema:
          type: string
    post:
      tags:
        - Backup
      summary: Authorize one browser backup download
      description: 'Requires an administrator session, CSRF verification, and step-up reauthentication: `X-Reauth-Password` for local-password admins, `X-Reauth-TOTP` (TOTP or bcrypt recovery code) for 2FA-enabled OAuth-only admins, or `X-Reauth-Confirm: DOWNLOAD-BACKUP` (or `oauth`) with a fresh session (`<= 300s` old) for OAuth-only admins without local password or TOTP. Issues a single-use 60s HttpOnly SameSite=Strict `af_backup_download` cookie scoped to `/api/v1/admin/backup/download/`.'
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - in: header
          name: X-Reauth-Password
          required: false
          schema:
            type: string
            maxLength: 1024
          description: Current administrator password (required when account has a local password)
        - in: header
          name: X-Reauth-TOTP
          required: false
          schema:
            type: string
            maxLength: 128
          description: 6-digit TOTP or bcrypt recovery code (required for 2FA-enabled OAuth-only admins)
        - in: header
          name: X-Reauth-Confirm
          required: false
          schema:
            type: string
            enum:
              - DOWNLOAD-BACKUP
              - oauth
          description: Explicit confirmation for fresh-session (<=300s) OAuth-only admins without password or TOTP
      responses:
        '200':
          description: Download authorization issued
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    get:
      tags:
        - Backup
      summary: Stream a verified backup
      description: Streams a SHA-256 verified backup archive or byte-range chunk. Requires an administrator session plus either the single-use `af_backup_download` cookie issued by `POST /admin/backup/download/{filename}` or direct step-up reauthentication headers (`X-Reauth-Password`, `X-Reauth-TOTP`, or `X-Reauth-Confirm`).
      security:
        - cookieAuth: []
      parameters:
        - in: header
          name: X-Reauth-Password
          required: false
          schema:
            type: string
            maxLength: 1024
        - in: header
          name: X-Reauth-TOTP
          required: false
          schema:
            type: string
            maxLength: 128
        - in: header
          name: X-Reauth-Confirm
          required: false
          schema:
            type: string
            enum:
              - DOWNLOAD-BACKUP
              - oauth
        - in: query
          name: chunk
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: chunk_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 67108864
            default: 10485760
      responses:
        '200':
          description: Verified backup stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Verified backup chunk stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
