components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aetherflow_session
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
      description: Double-submit CSRF token bound to the authenticated session
  responses:
    Error:
      description: Structured API error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error description
        details:
          type: object
          additionalProperties: true
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    SetupRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
        setup_token:
          type: string
          description: Optional one-time bootstrap setup token when required by host policy
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        avatar_url:
          type: string
        role:
          type: string
        is_oauth:
          type: boolean
    Settings:
      type: object
      properties:
        aiModel:
          type: string
        systemPrompt:
          type: string
        language:
          type: string
        timezone:
          type: string
        updateChannel:
          type: string
        defaultDashboard:
          type: string
        setupCompleted:
          type: boolean
        geminiApiKey:
          type: string
    ServiceControlRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - start
            - stop
            - restart
        managed_by:
          type: string
        process:
          type: string
    ServiceInfo:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        uptime:
          type: string
        managed_by:
          type: string
        process:
          type: string
        launch_url:
          type: string
          format: uri
        launch_scope:
          type: string
          enum: [public, internal, network, unavailable]
    ServiceMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ServiceInfo'
    MarketplaceApp:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        desc:
          type: string
        hits:
          type: integer
        category:
          type: string
        status:
          type: string
        progress:
          type: integer
        installed_version:
          type: string
        latest_version:
          type: string
        update_available:
          type: boolean
        inventory_known:
          type: boolean
        inventory_authenticated:
          type: boolean
        inventory_mode:
          type: string
          enum: [authenticated, public_redacted]
        launch_url:
          type: string
          format: uri
          description: Resolved address for an installed app in authenticated inventory.
        launch_scope:
          type: string
          enum: [public, internal, network, unavailable]
          description: The access path selected by the server. An unavailable target has no launch URL.
    PackageProgress:
      type: object
      properties:
        status:
          type: string
        progress:
          type: integer
        started_at:
          type: string
        log_line:
          type: string
        log_lines:
          type: integer
    FileInfo:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
        modTime:
          type: string
        extension:
          type: string
    UserQuota:
      type: object
      properties:
        user_id:
          type: integer
        username:
          type: string
        quota_bytes:
          type: integer
        used_bytes:
          type: integer
        available_bytes:
          type: integer
        usage_pct:
          type: number
        configured:
          type: boolean
        status:
          type: string
    SystemMetrics:
      type: object
      properties:
        cpu_usage:
          type: number
        memory:
          type: object
          additionalProperties:
            type: number
        disk_space:
          type: object
          additionalProperties:
            type: number
    HardwareInfo:
      type: object
      additionalProperties: true
    AppIngressUpdateRequest:
      type: object
      properties:
        publicDomain:
          type: string
          description: Public hostname for external reverse-proxy exposure (required when externalAccessEnabled is true)
        externalAccessEnabled:
          type: boolean
          default: false
          description: Whether external reverse-proxy access is enabled (defaults to false on first creation unless explicitly true; omitted values preserve existing state on update)
        listenPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Application listen port (cannot be changed via ingress API once bound)
        tlsEnabled:
          type: boolean
          description: Whether TLS termination is enabled for the public domain (defaults to true when publicDomain is non-empty on first creation)
    GenericObject:
      type: object
      additionalProperties: true
    GenericArray:
      type: array
      items:
        type: object
        additionalProperties: true
