  /auth/user/2fa/recovery/regenerate:
    post:
      tags:
        - Auth
      summary: Regenerate 2FA recovery codes
      description: Replaces existing 2FA recovery codes after verifying a TOTP or unused recovery `code` and the user's current `password`. Accounts with a local password must supply a non-empty `password` (otherwise rejected with `403 INVALID_CURRENT_PASSWORD` without consuming the TOTP code); passwordless OAuth-only accounts may omit `password`.
      responses:
        '200':
          description: Recovery codes regenerated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: Current 6-digit TOTP code or unused recovery code
                password:
                  type: string
                  description: Current account password (required non-empty for password-backed accounts; optional for passwordless OAuth-only accounts)
  /auth/user/2fa/setup:
    post:
