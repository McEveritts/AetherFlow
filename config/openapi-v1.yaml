              properties:
                name:
                  type: string
                url:
                  type: string
                apiKey:
                  type: string
                enabled:
                  type: boolean
  /admin/streaming/servers/{provider}/sync:
    parameters:
      - in: path
        name: provider
        required: true
        description: Streaming media provider identifier (`jellyfin` is supported; `emby` returns `501 Not Implemented`; other providers return `400 Bad Request`)
        schema:
          type: string
    post:
      tags:
        - Streaming
      summary: Execute streaming servers sync
      description: Executes a bounded summary and metadata synchronization batch for `jellyfin`. Returns `501 Not Implemented` for `emby` and `400 Bad Request` for other unsupported providers.
      responses:
        '200':
          description: Bounded summary synchronization batch result
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - imported
                  - complete
                  - has_more
                  - remaining_sources
                properties:
                  message:
                    type: string
                  imported:
                    type: integer
                    minimum: 0
                  complete:
                    type: boolean
                    description: True when all summary sources have been fully swept
                  has_more:
                    type: boolean
                    description: True when additional items remain and another sync call will resume from the saved checkpoint
                  remaining_sources:
                    type: integer
                    minimum: 0
                    description: Number of uncompleted summary checkpoint sources remaining
                  next_offset:
                    type: integer
                    nullable: true
                    minimum: 0
                    description: Next pagination offset within the active summary source when `has_more` is true
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
