            schema:
              type: object
              properties:
                upload_kbps:
                  type: integer
                  minimum: 0
                  default: 0
                download_kbps:
                  type: integer
                  minimum: 0
                  default: 0
                client:
                  type: string
                  enum:
                    - auto
                    - transmission
                    - qbittorrent
                    - deluge
