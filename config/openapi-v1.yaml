openapi: 3.1.0
info:
  title: AetherFlow API
  version: 4.0.0
  description: Authoritative OpenAPI 3.1 specification for the AetherFlow v4.0.0 pure-Rust control plane (`af-api`). Endpoints under `/api/v1` are namespaced by trust tier (`/public`, `/auth`, and `/admin`). Authenticated state-changing requests (`POST`, `PUT`, `PATCH`, `DELETE`) require a valid `X-CSRF-Token` header.
servers:
  - url: /api/v1
    description: Canonical v1
  - url: /api
    description: Legacy compatibility (Deprecated)
tags:
  - name: Auth
    description: Session authentication, MFA, OAuth, and user profile management
  - name: System
    description: Control-plane health, metrics, settings, updates, logs, and audit trail
  - name: Services
    description: Managed systemd service lifecycle and ingress routing
  - name: Marketplace
    description: Bare-metal package catalog, installation, updates, blueprints, and MediaFlow
  - name: Files
    description: Shared file uploads, downloads, and filesystem browsing
  - name: McBrowser
    description: Capability-scoped native file manager, TUS uploads, media previews, and public shares
  - name: Streaming
    description: Canonical playback history, analytics patterns, reconciliation, and portability
  - name: Plugins
    description: Sandboxed native Rust plugin UI, proxy, lifecycle control, and scoped tokens
  - name: Backup
    description: WAL-safe encrypted system backups and step-up verified downloads
  - name: Users
    description: Administrator user and RBAC management
  - name: Quotas
    description: Per-user storage quota configuration and accounting
  - name: Notifications
    description: In-app notifications, alert rules, and outbound webhook channels
  - name: OIDC
    description: OpenID Connect provider, device flow, and client registration
  - name: AI
    description: FlowAI assistant, metadata scanning, bandwidth optimization, and predictive scaling
  - name: Cluster
    description: Multi-node worker enrollment and telemetry
  - name: Network
    description: WireGuard, Tailscale, and host network diagnostics
  - name: Operator
    description: Headless Operator APIs for CLI (`af`) and automation integration
