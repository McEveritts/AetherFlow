  /admin/streaming/portability/export:
    get:
      tags:
        - Streaming
      summary: Get streaming portability export
      description: Archives retain all playback history, labels, and tracking policy. If older telemetry samples are omitted to fit the 100,000-record cap, the archive manifest includes `omittedSamples` with both counts. The serialized archive may not exceed 8 MiB.
      responses:
        '200':
          description: Streaming history archive
          headers:
            x-aetherflow-archive-telemetry:
              description: Whether the archive contains all routine telemetry samples.
              schema:
                type: string
                enum: [complete, partial]
            x-aetherflow-omitted-session-samples:
              description: Number of omitted session samples. Present for partial telemetry archives.
              schema:
                type: integer
                minimum: 0
            x-aetherflow-omitted-bandwidth-samples:
              description: Number of omitted bandwidth samples. Present for partial telemetry archives.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
