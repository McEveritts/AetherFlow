[[rules]]
id = "curl-auth-header"

  # ── Active v4 Working-Tree Test Allowlists ───────────────────────────────

  [[rules.allowlists]]
  description = "Synthetic bearer canary in the authenticated WebSocket redaction regression"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend-rs/crates/af-api/src/ws(?:/telemetry_tests)?\.rs$''']
  regexes = ['''^my_super_secret_bearer_token$''']

  [[rules.allowlists]]
  description = "Exact synthetic header canary in the final lifecycle masking regression"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend-rs/crates/af-services/src/package_jobs(?:/unit_tests)?\.rs$''']
  regexes = ['''^FRAGMENT_CANARY$''']

  [[rules.allowlists]]
  description = "Synthetic API_CANARY redaction fixture in safe updates unit tests"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^tests/test_marketplace_safe_updates\.py$''']
  regexes = ['''^API_CANARY$''']

[[rules]]
id = "curl-auth-user"

  # ── Active v4 Working-Tree Test Allowlists ───────────────────────────────

  [[rules.allowlists]]
  description = "Exact synthetic curl credentials in lifecycle and diagnostic redaction regressions"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''^backend-rs/crates/af-api/src/(?:routes|ws)\.rs$''',
    '''^backend-rs/crates/af-api/src/ws/telemetry_tests\.rs$''',
    '''^backend-rs/crates/af-api/src/routes/tests(?:/marketplace_catalog)?\.rs$''',
    '''^backend-rs/crates/af-release/src/lifecycle(?:/tests/redaction_tests)?\.rs$''',
    '''^backend-rs/crates/af-runner/src/package_lifecycle\.rs$''',
    '''^backend-rs/crates/af-runner/src/package_lifecycle/version_verification_tests(?:/redaction_and_receipts)?\.rs$''',
    '''^backend-rs/crates/af-services/src/(?:package_jobs(?:/unit_tests)?|workers)\.rs$''',
    '''^backend-rs/crates/af-services/src/workers/tests(?:/discovery_and_pagination)?\.rs$''',
  ]
  regexes = [
    '''^admin:(?:mysecret123|hunter2|synthetic-secret|secret_pass|secret|supersecret|super_secret_curl|SECRET)$''',
    '''^"admin:(?:my secret|SECRET words)"$''',
    '''^operator:SENTINEL$''',
  ]

  [[rules.allowlists]]
  description = "Synthetic template placeholder curl credentials in Python safe updates unit tests"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^tests/test_marketplace_safe_updates\.py$''']
  regexes = ['''^(?:operator:" \{sentinel\}"|admin:\{sentinel\})$''']

