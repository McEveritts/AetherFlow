title = "AetherFlow Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allow synthetic unit test fixtures and upstream default package config templates"
paths = [
  '''_test\.go$''',
  '''^setup/configs/''',
  '''^tests/''',
]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Allow RFC 6455 sample Sec-WebSocket-Key nonce in af-api middleware unit test"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^backend-rs/crates/af-api/src/middlewares\.rs$''',
  ]
  regexes = [
    '''^\s*"Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\\r\\n",\s*$''',
  ]

  [[rules.allowlists]]
  description = "Allow synthetic VALID_TOKEN share fixture in share unit tests"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^frontend/src/app/share/page\.test\.tsx$''',
    '''^frontend/src/lib/mcbrowser-share\.test\.ts$''',
  ]
  regexes = [
    '''^\s*const VALID_TOKEN = 'AbCdEfGhIjKlMnOpQrStUvWxYz0123456789_-abcd';\s*$''',
  ]

  [[rules.allowlists]]
  description = "Allow synthetic sessionKey fixture in StreamingTab unit test"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^frontend/src/components/tabs/StreamingTab\.test\.tsx$''',
  ]
  regexes = [
    '''^\s*sessionKey: 'hist-2-legacy',\s*$''',
  ]

  [[rules.allowlists]]
  description = "Synthetic lifecycle redaction canary in the API persistence regression"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend-rs/crates/af-api/src/routes\.rs$''']
  regexes = ['''^secret_(?:gh_tok_789|api_key_000)$''']

[[rules]]
id = "curl-auth-header"

  [[rules.allowlists]]
  description = "Synthetic bearer canary in the authenticated WebSocket redaction regression"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend-rs/crates/af-api/src/ws\.rs$''']
  regexes = ['''^my_super_secret_bearer_token$''']

  [[rules.allowlists]]
  description = "Exact synthetic header canary in the final lifecycle masking regression"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend-rs/crates/af-services/src/package_jobs\.rs$''']
  regexes = ['''^FRAGMENT_CANARY$''']

[[rules]]
id = "curl-auth-user"

  [[rules.allowlists]]
  description = "Exact synthetic curl credentials in lifecycle and diagnostic redaction regressions"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''^backend-rs/crates/af-api/src/(?:routes|ws)\.rs$''',
    '''^backend-rs/crates/af-release/src/lifecycle\.rs$''',
    '''^backend-rs/crates/af-runner/src/package_lifecycle\.rs$''',
    '''^backend-rs/crates/af-services/src/(?:package_jobs|workers)\.rs$''',
  ]
  regexes = [
    '''^admin:(?:mysecret123|hunter2|synthetic-secret|secret_pass|secret|supersecret|super_secret_curl|SECRET)$''',
    '''^"admin:(?:my secret|SECRET words)"$''',
    '''^operator:SENTINEL$''',
  ]
