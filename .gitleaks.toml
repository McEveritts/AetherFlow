title = "AetherFlow Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  # ── Active v4 Working-Tree Test & Script Allowlists ──────────────────────
  # Scoped strictly to synthetic fixtures and benign parser tokens in active
  # v4 Rust crates, Python regression suites, and deployment scripts.

  [[rules.allowlists]]
  description = "Allow RFC 6455 sample Sec-WebSocket-Key nonce in af-api middleware unit test"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''^backend-rs/crates/af-api/src/middlewares(?:/tests)?\.rs$''',
  ]
  regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

  [[rules.allowlists]]
  description = "Synthetic lifecycle redaction canary in the API persistence regression"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend-rs/crates/af-api/src/(?:routes\.rs|routes/tests(?:/marketplace_catalog)?\.rs)$''']
  regexes = ['''^secret_(?:gh_tok_789|api_key_000)$''']

  [[rules.allowlists]]
  description = "Synthetic AES_MASTER_KEY test fixture (sequential hex) in Rust DB and Python env unit tests"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''^backend-rs/crates/af-db/src/lib\.rs$''',
    '''^tests/test_modern_stack_env\.py$''',
  ]
  regexes = ['''^0123456789abcdef0123456789abcdef$''']

  [[rules.allowlists]]
  description = "Synthetic env flag and helper identifier false positives in catalog lifecycle tests"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^tests/test_marketplace_catalog_lifecycle_matrix\.py$''']
  regexes = ['''^(?:AF_KEEP_EXISTING_SECRETS=|generate_qbittorrent_pbkdf2)$''']

  [[rules.allowlists]]
  description = "Shell variable assignment following empty ENV_FILE_GITHUB_TOKEN initializer in release-manager.sh"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^deploy/release-manager\.sh$''']
  regexes = ['''^EFFECTIVE_SKIP_PROVENANCE_VERIFY=$''']

  [[rules.allowlists]]
  description = "Historical synthetic sequential-hex ruTorrent proxy token fixture in v4 middleware unit test commits"
  condition = "AND"
  regexTarget = "secret"
  commits = [
    '''45ea145693e7edc35bef8d8635bd359a499cc494''',
    '''8d1bb7228b3148528f6b0d9203aca4665c9cb37d''',
  ]
  paths = ['''^backend-rs/crates/af-api/src/middlewares/tests\.rs$''']
  regexes = ['''^0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef$''']

  [[rules.allowlists]]
  description = "Historical serde deserialize_with attribute false positive after isOauth alias in v4 contracts.rs commit"
  condition = "AND"
  regexTarget = "secret"
  commits = ['''fda09f793e808399e8b3acb13159377cf9fe052d''']
  paths = ['''^frontend-rs/crates/af-web-app/src/tabs/contracts\.rs$''']
  regexes = ['''^deserialize_with=$''']

  # ── Historical Commit-Pinned Pre-v4 Allowlists (Retired Go / Next.js / Legacy Configs) ──
  # Every retired pre-v4 path below (`backend/*`, `frontend/*`, `setup/configs/headphones/*`,
  # `rutorrent/*`) is absent from the v4 working tree and pinned to exact immutable git
  # history commits scanned during full-history `gitleaks git .` runs. Active v4 paths
  # (`backend-rs/`, `frontend-rs/`, `apps/`, `packages/`, `deploy/`, `setup/`, `scripts/`)
  # retain full secret-scanning coverage.

