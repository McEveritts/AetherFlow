title = "AetherFlow Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Allow RFC 6455 sample Sec-WebSocket-Key nonce in af-api middleware unit test"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^backend-rs/crates/af-api/src/middlewares\.rs$''',
  ]
  regexes = [
    '''^\s*"Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\\r\\n",\s*$''',
  ]

  [[rules.allowlists]]
  description = "Allow synthetic VALID_TOKEN share fixture in share unit tests"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^frontend/src/app/share/page\.test\.tsx$''',
    '''^frontend/src/lib/mcbrowser-share\.test\.ts$''',
  ]
  regexes = [
    '''^\s*const VALID_TOKEN = 'AbCdEfGhIjKlMnOpQrStUvWxYz0123456789_-abcd';\s*$''',
  ]

  [[rules.allowlists]]
  description = "Allow synthetic sessionKey fixture in StreamingTab unit test"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^frontend/src/components/tabs/StreamingTab\.test\.tsx$''',
  ]
  regexes = [
    '''^\s*sessionKey: 'hist-2-legacy',\s*$''',
  ]

  [[rules.allowlists]]
  description = "Synthetic lifecycle redaction canary in the API persistence regression"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend-rs/crates/af-api/src/routes\.rs$''']
  regexes = ['''^secret_(?:gh_tok_789|api_key_000)$''']

  [[rules.allowlists]]
  description = "Synthetic AES_MASTER_KEY test fixture (sequential hex) in Go, Rust DB, and Python env unit tests"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''^backend/config/config_test\.go$''',
    '''^backend-rs/crates/af-db/src/lib\.rs$''',
    '''^tests/test_modern_stack_env\.py$''',
  ]
  regexes = ['''^0123456789abcdef0123456789abcdef$''']

  [[rules.allowlists]]
  description = "Synthetic AIza test string in Go crypto unit test"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend/api/crypto_test\.go$''']
  regexes = ['''^AIzaSyA_test_key_12345$''']

  [[rules.allowlists]]
  description = "Synthetic CSRF test tokens in Go auth and revocation tests"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''^backend/api/auth_security_test\.go$''',
    '''^backend/api/auth_session_revocation_adversarial_test\.go$''',
  ]
  regexes = ['''^(?:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4|f7e8d9c0b1a23456789abcdef0123456)$''']

  [[rules.allowlists]]
  description = "Synthetic API key fixtures in Go app credentials unit tests"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend/services/app_credentials_test\.go$''']
  regexes = ['''^(?:sabnzbd-key-abcdef123456|tautulli-secret-key-42|jackett-api-key-xyz987)$''']

  [[rules.allowlists]]
  description = "Synthetic env flag and helper identifier false positives in catalog lifecycle tests"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^tests/test_marketplace_catalog_lifecycle_matrix\.py$''']
  regexes = ['''^(?:AF_KEEP_EXISTING_SECRETS=|generate_qbittorrent_pbkdf2)$''']

  [[rules.allowlists]]
  description = "Synthetic unsigned/invalid-signature JWT test fixture in Go auth security test"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend/api/auth_security_test\.go$''']
  regexes = [
    '''^eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9\.eyJ1c2VyX2lkIjoxLCJleHAiOjk5OTk5OTk5OTl9\.invalid-signature$''',
  ]

  [[rules.allowlists]]
  description = "Upstream Headphones public default songkick_apikey template placeholder"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^setup/configs/headphones/config\.ini$''']
  regexes = ['''^nd1We7dFW2RqxPw8$''']

  [[rules.allowlists]]
  description = "RFC 4648 Base32 alphabet string in legacy 2017 ruTorrent util.php base32decode helper"
  condition = "AND"
  regexTarget = "secret"
  commits = ['''d19530cf9d5ab281dbd04ba8378febf47a04ab4e''']
  paths = ['''^rutorrent/php/util\.php$''']
  regexes = ['''^ABCDEFGHIJKLMNOPQRSTUVWXYZ234567=$''']

[[rules]]
id = "jwt"

  [[rules.allowlists]]
  description = "Synthetic unsigned/invalid-signature JWT test fixture in Go auth security test"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend/api/auth_security_test\.go$''']
  regexes = ['''^eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9\.eyJ1c2VyX2lkIjoxLCJleHAiOjk5OTk5OTk5OTl9\.invalid-signature$''']

[[rules]]
id = "curl-auth-header"

  [[rules.allowlists]]
  description = "Synthetic bearer canary in the authenticated WebSocket redaction regression"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend-rs/crates/af-api/src/ws\.rs$''']
  regexes = ['''^my_super_secret_bearer_token$''']

  [[rules.allowlists]]
  description = "Exact synthetic header canary in the final lifecycle masking regression"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^backend-rs/crates/af-services/src/package_jobs\.rs$''']
  regexes = ['''^FRAGMENT_CANARY$''']

  [[rules.allowlists]]
  description = "Synthetic API_CANARY redaction fixture in safe updates unit tests"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^tests/test_marketplace_safe_updates\.py$''']
  regexes = ['''^API_CANARY$''']

[[rules]]
id = "curl-auth-user"

  [[rules.allowlists]]
  description = "Exact synthetic curl credentials in lifecycle and diagnostic redaction regressions"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''^backend-rs/crates/af-api/src/(?:routes|ws)\.rs$''',
    '''^backend-rs/crates/af-release/src/lifecycle\.rs$''',
    '''^backend-rs/crates/af-runner/src/package_lifecycle\.rs$''',
    '''^backend-rs/crates/af-services/src/(?:package_jobs|workers)\.rs$''',
  ]
  regexes = [
    '''^admin:(?:mysecret123|hunter2|synthetic-secret|secret_pass|secret|supersecret|super_secret_curl|SECRET)$''',
    '''^"admin:(?:my secret|SECRET words)"$''',
    '''^operator:SENTINEL$''',
  ]

  [[rules.allowlists]]
  description = "Synthetic template placeholder curl credentials in Python safe updates unit tests"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^tests/test_marketplace_safe_updates\.py$''']
  regexes = ['''^(?:operator:" \{sentinel\}"|admin:\{sentinel\})$''']

[[rules]]
id = "private-key"

  [[rules.allowlists]]
  description = "Historical truncated synthetic PEM redaction test fixture in retired commit"
  condition = "AND"
  regexTarget = "line"
  commits = ['''d0642207b26532da09192818e36d73f21719f817''']
  paths = ['''^backend-rs/crates/af-runner/src/package_executor\.rs$''']
  regexes = ['''MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC7''']

  [[rules.allowlists]]
  description = "Legacy dev OIDC PEM files purged from working tree in historical commits"
  condition = "AND"
  commits = [
    '''d4ee685901bb8f7f6ec098defd5898410e8584d0''',
    '''2617cbd4774d9fb019174e97e82b4074c8e8b3c8''',
  ]
  paths = ['''^backend/(?:api/)?data/oidc_rsa\.pem$''']
