<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Telemetry Inspector (1.0.0)</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    background: #050811;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
  }
  .card {
    border: 1px solid rgba(99, 102, 241, 0.25);
    background: rgba(15, 23, 42, 0.75);
    border-radius: 12px;
    padding: 16px;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.15);
    color: #6ee7b7;
    border: 1px solid rgba(16, 185, 129, 0.3);
  }
  button {
    margin-top: 12px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  pre {
    margin-top: 12px;
    padding: 10px;
    background: #020617;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    font-size: 11px;
    overflow-x: auto;
  }
</style>
</head>
<body>
  <div class="card" data-plugin-id="telemetry-inspector" data-testid="telemetry-inspector-runtime-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong>Telemetry Inspector</strong>
      <span class="badge" data-testid="telemetry-inspector-bundle-badge">Managed Loopback Runtime v1.0.0</span>
    </div>
    <p style="font-size:12px;color:#94a3b8;margin:8px 0;">
      Sandboxed companion UI communicating exclusively via host postMessage bridge and loopback reverse proxy.
    </p>
    <div style="font-size:11px;color:#64748b;">
      Granted Scopes: <code>GET /api/v1/public/marketplace, GET /api/v1/auth/system/metrics</code>
    </div>
    <button id="probe-btn" data-testid="telemetry-inspector-probe-btn" type="button">
      Probe Managed Runtime Status
    </button>
    <pre id="output" data-testid="telemetry-inspector-bridge-output">Waiting for host capability handshake...</pre>
  </div>
  <script>
    const pluginId = 'telemetry-inspector';
    const outputNode = document.getElementById('output');
    const requestStatusThroughBridge = () => {
      window.parent.postMessage({
        type: 'AF_PLUGIN_PROXY_REQUEST',
        pluginId,
        path: 'status',
        method: 'GET'
      }, '*');
    };
    window.addEventListener('message', (event) => {
      const msg = event.data || {};
      if (msg.type === 'AF_PLUGIN_INIT') {
        outputNode.textContent = JSON.stringify({
          status: 'handshake_complete',
          capabilities: msg.capabilities || []
        }, null, 2);
        requestStatusThroughBridge();
      } else if (msg.type === 'AF_PLUGIN_PROXY_RESPONSE') {
        outputNode.textContent = JSON.stringify(msg.payload, null, 2);
      }
    });
    document.getElementById('probe-btn').addEventListener('click', () => {
      requestStatusThroughBridge();
    });
    window.parent.postMessage({ type: 'AF_PLUGIN_READY', pluginId }, '*');
  </script>
</body>
</html>
