###############################################################################
# AetherFlow Release Manager — Configuration
#
# This file is sourced by release-manager.sh. All values are overridable
# via environment variables at runtime (ENV takes precedence).
###############################################################################

# ── Directory Layout ─────────────────────────────────────────────────────────
# Root directory where isolated release directories are created.
RELEASES_DIR="${RELEASES_DIR:-/opt/AetherFlow/releases}"

# The symlink that always points to the "live" release.
CURRENT_LINK="${CURRENT_LINK:-/opt/AetherFlow/current}"

# The source repository root used to build from.
REPO_DIR="${REPO_DIR:-/opt/AetherFlow}"

# ── Git ──────────────────────────────────────────────────────────────────────
GIT_BRANCH="${GIT_BRANCH:-master}"
GIT_REMOTE="${GIT_REMOTE:-origin}"

# ── Health Probe ─────────────────────────────────────────────────────────────
# The deep-readiness endpoint that must return HTTP 200 with "status":"ready".
HEALTH_ENDPOINT="${HEALTH_ENDPOINT:-http://127.0.0.1:8080/health/ready}"

# Number of polling attempts before declaring a failed deployment.
HEALTH_RETRIES="${HEALTH_RETRIES:-10}"

# Seconds between each health probe attempt.
HEALTH_INTERVAL="${HEALTH_INTERVAL:-3}"

# ── Housekeeping ─────────────────────────────────────────────────────────────
# Maximum number of release directories to retain. Oldest are pruned first.
MAX_RELEASES="${MAX_RELEASES:-3}"

# ── Build ────────────────────────────────────────────────────────────────────
# Go compiler path (bare-metal deployments often use a non-PATH location).
GO_BIN="${GO_BIN:-/usr/local/go/bin/go}"

# Node heap limit for low-memory VMs (in MB).
NODE_HEAP_MB="${NODE_HEAP_MB:-1024}"

# ── Logging ──────────────────────────────────────────────────────────────────
LOG_FILE="${LOG_FILE:-/var/log/aetherflow_deploy.log}"

# ── State Snapshot (Phase 2) ─────────────────────────────────────────────────
# Persistent data volume shared by all releases.
DATA_DIR="${DATA_DIR:-/var/lib/aetherflow}"

# Primary SQLite database filename within DATA_DIR.
SQLITE_DB="${SQLITE_DB:-aetherflow.sqlite}"

# Maximum seconds to hold the flock during snapshot operations.
SNAPSHOT_TIMEOUT="${SNAPSHOT_TIMEOUT:-30}"

# ── Systemd Migration (Phase 2) ─────────────────────────────────────────────
# Directory containing the hardened .service unit templates.
SYSTEMD_UNITS_SRC="${SYSTEMD_UNITS_SRC:-${SCRIPT_DIR}/systemd}"

# Target directory for installed systemd units.
SYSTEMD_UNITS_DST="${SYSTEMD_UNITS_DST:-/etc/systemd/system}"
