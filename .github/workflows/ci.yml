name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - development
  push:
    branches:
      - main
      - master
      - development

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Unit Tests
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
        run: go test ./... -count=1

      - name: Build API Binary
        run: |
          mkdir -p dist
          go build -o dist/aetherflow-api .

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-aetherflow-api
          path: backend/dist/aetherflow-api
          if-no-files-found: error

  frontend:
    name: Frontend Monorepo Ecosystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Workspace Packages
        run: |
          cd packages/ui
          npm run typecheck

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Unit Tests
        run: |
          cd frontend
          npm run test:ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: E2E Tests
        run: |
          cd frontend
          npm run test:e2e

      - name: Static Export Build
        env:
          NEXT_STATIC_EXPORT: "1"
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-export
          path: frontend/out
          if-no-files-found: error
