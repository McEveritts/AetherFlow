name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - development
      - nightly
      - Nightly
  push:
    branches:
      - main
      - master
      - development
      - nightly
      - Nightly

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-routing:
    name: Release Routing Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Release Routing and Manager
        run: python3 -m unittest discover -s tests -p 'test_release*.py' -v

  node-installers:
    name: Node Application Installer Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node with the affected npm version
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Test Dependency Preparation and Marketplace Lifecycle
        run: |
          python3 -m unittest discover -s tests -p 'test_node_installers.py' -v
          python3 -m unittest discover -s tests -p 'test_thelounge_installer.py' -v
          python3 -m unittest discover -s tests -p 'test_marketplace*.py' -v
          python3 tests/check_shell_hygiene.py

  palate-installer:
    name: Palate Installer Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Installer and Remover Syntax
        run: |
          bash -n packages/package/install/installpackage-palate
          bash -n packages/package/remove/removepackage-palate

      - name: Test Palate Lifecycle
        run: python3 -m unittest discover -s tests -p 'test_palate_installer.py' -v

  jellyseerr-installer:
    name: Jellyseerr / Seerr Installer Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Installer Syntax
        run: bash -n packages/package/install/installpackage-jellyseerr

      - name: Test Upgrade and Rollback
        run: python3 -m unittest discover -s tests -p 'test_jellyseerr_installer.py' -v

  release-lifecycle-smoke:
    name: v4 Release, Bootstrap, OS Matrix & Lifecycle Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQLite & Shell Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 bc curl ca-certificates python3-yaml

      - name: Run Deterministic v4 Release Lifecycle & OS Matrix Smoke Harness
        run: |
          bash scripts/smoke_v4_release_lifecycle.sh

      - name: Run Release, Build Tools & Bootstrap Regression Suite
        run: |
          python3 -m unittest discover -s tests -p 'test_rust_build_tools.py' -v
          python3 -m unittest discover -s tests -p 'test_release_manager.py' -v
          python3 -m unittest discover -s tests -p 'test_v4_release_bootstrap_ci.py' -v
          python3 tests/check_shell_hygiene.py

  frontend:
    name: Frontend (Next.js Static Export & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        working-directory: .
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Unit Tests
        run: npm run test:ci

      - name: Static Export Build
        env:
          NEXT_STATIC_EXPORT: "1"
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-export
          path: frontend/out
          if-no-files-found: error

  backend-rs:
    name: Backend & Single-Binary Bundle (Rust)
    runs-on: ubuntu-22.04
    needs: frontend
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mold Linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang pkg-config libssl-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend-rs -> target"

      - name: Download Frontend Static Export (Neutral & Legacy Staging)
        uses: actions/download-artifact@v4
        with:
          name: frontend-static-export
          path: web/dist

      - name: Mirror Frontend Static Export to Legacy Path
        working-directory: .
        run: |
          mkdir -p backend/web/dist
          cp -R web/dist/. backend/web/dist/

      - name: Verify Workspace Lockfile & Run Unit Tests (Rust Workspace)
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
          AETHERFLOW_DISABLE_BACKGROUND_WORKERS: "1"
        run: |
          test -f Cargo.lock
          cargo test --workspace --locked -- --test-threads=1

      - name: Build Embedded Single-Binary & Native CLI (Rust)
        run: |
          cargo build --release --locked --bin aetherflow-api --bin af

      - name: Upload Rust Single-Binary & CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherflow-rs-single-binary
          path: |
            backend-rs/target/release/aetherflow-api
            backend-rs/target/release/af
          if-no-files-found: error

  embedded-e2e:
    name: Embedded Rust Single-Binary Full-Stack E2E
    runs-on: ubuntu-22.04
    needs: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for Playwright Client Runner)
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Rust Single-Binary & CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: aetherflow-rs-single-binary
          path: backend-rs/target/release

      - name: Make Compiled Binaries Executable
        run: |
          chmod +x backend-rs/target/release/aetherflow-api backend-rs/target/release/af

      - name: Install Playwright Chromium Browser
        run: |
          npm ci
          cd frontend
          npx playwright install --with-deps chromium

      - name: Execute Embedded Single-Binary Full-Stack & Playwright E2E
        env:
          CI: "true"
        run: |
          bash scripts/run_embedded_e2e.sh --binary "${PWD}/backend-rs/target/release/aetherflow-api" --port 18080 --playwright

  backend:
    name: Backend & Single-Binary Bundle (Go Legacy)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download Frontend Static Export
        uses: actions/download-artifact@v4
        with:
          name: frontend-static-export
          path: backend/web/dist

      - name: Unit Tests (including Embedded SPA & Privileged Runner)
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
        run: go test ./... -count=1

      - name: Build Embedded Single-Binary (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist/aetherflow-api .

      - name: Upload Single-Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherflow-single-binary
          path: backend/dist/aetherflow-api
          if-no-files-found: error
