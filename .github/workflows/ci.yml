name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - development
      - nightly
      - Nightly
      - experimental
  push:
    branches:
      - main
      - master
      - development
      - nightly
      - Nightly
      - experimental

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-routing:
    name: Release Routing Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Release Routing and Manager
        run: python3 -m unittest discover -s tests -p 'test_release*.py' -v

  node-installers:
    name: Node Application Installer Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node with the affected npm version
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Test Dependency Preparation and Marketplace Lifecycle
        run: |
          python3 -m unittest discover -s tests -p 'test_node_installers.py' -v
          python3 -m unittest discover -s tests -p 'test_marketplace*.py' -v
          python3 tests/check_shell_hygiene.py

  palate-installer:
    name: Palate Installer Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Installer and Remover Syntax
        run: |
          bash -n packages/package/install/installpackage-palate
          bash -n packages/package/remove/removepackage-palate

      - name: Test Palate Lifecycle
        run: python3 -m unittest discover -s tests -p 'test_palate_installer.py' -v

  jellyseerr-installer:
    name: Jellyseerr / Seerr Installer Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Installer Syntax
        run: bash -n packages/package/install/installpackage-jellyseerr

      - name: Test Upgrade and Rollback
        run: python3 -m unittest discover -s tests -p 'test_jellyseerr_installer.py' -v

  youtube-packages:
    name: Invidious and Piped Package Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test YouTube Marketplace Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-yaml apache2-bin jq
          bash -n packages/youtube-common.sh
          for app in invidious piped; do
            bash -n "packages/package/install/installpackage-${app}"
            bash -n "packages/package/remove/removepackage-${app}"
          done
          PATH="/usr/sbin:$PATH" /usr/bin/python3 -m unittest discover -s tests -p 'test_youtube_packages.py' -v

  frontend:
    name: Frontend (Next.js Static Export & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        working-directory: .
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Unit Tests
        run: npm run test:ci

      - name: Static Export Build
        env:
          NEXT_STATIC_EXPORT: "1"
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-export
          path: frontend/out
          if-no-files-found: error

  backend-rs:
    name: Backend & Single-Binary Bundle (Rust)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mold Linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang pkg-config libssl-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend-rs -> target"

      - name: Download Frontend Static Export
        uses: actions/download-artifact@v4
        with:
          name: frontend-static-export
          path: backend/web/dist

      - name: Unit Tests (Rust Workspace)
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
        run: cargo test --workspace

      - name: Verify Updater Survives Its Caller Restart
        run: |
          test_binary=$(cargo test -p af-runner --lib --no-run --message-format=json | python3 -c 'import json,sys; artifacts=[json.loads(line) for line in sys.stdin if line.startswith("{")]; binaries=[item["executable"] for item in artifacts if item.get("reason")=="compiler-artifact" and item.get("executable") and item["target"]["name"]=="af_runner"]; assert len(binaries)==1; print(binaries[0])')
          sudo "$test_binary" self_update::tests::updater_survives_caller_restart --ignored --exact --nocapture

      - name: Build Embedded Single-Binary (Rust)
        run: |
          cargo build --release --bin aetherflow-api

      - name: Upload Rust Single-Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherflow-rs-single-binary
          path: backend-rs/target/release/aetherflow-api
          if-no-files-found: error

  backend:
    name: Backend & Single-Binary Bundle (Go Legacy)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download Frontend Static Export
        uses: actions/download-artifact@v4
        with:
          name: frontend-static-export
          path: backend/web/dist

      - name: Unit Tests (including Embedded SPA & Privileged Runner)
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
        run: go test ./... -count=1

      - name: Build Embedded Single-Binary (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist/aetherflow-api .

      - name: Upload Single-Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherflow-single-binary
          path: backend/dist/aetherflow-api
          if-no-files-found: error
