name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - development
      - nightly
      - Nightly
  push:
    branches:
      - main
      - master
      - development
      - nightly
      - Nightly

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-routing:
    name: Release Routing Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test Release Routing, Provenance & Modern Stack
        run: |
          python3 -m unittest discover -s tests -p 'test_release*.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_provenance.py' -v
          python3 -m unittest discover -s tests -p 'test_modern_stack_env.py' -v

  node-installers:
    name: Node Application Installer Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node with pinned older version for installer npm regression testing (distinct from frontend engine >=22.19)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.12.0

      - name: Install Python & Shell Test Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-yaml apache2-bin jq sqlite3 bc

      - name: Test Dependency Preparation and Marketplace Lifecycle
        run: |
          PATH="$PATH:/usr/sbin" /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/check_shell_hygiene.py

  palate-installer:
    name: Palate Installer Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Installer and Remover Syntax
        run: |
          bash -n packages/package/install/installpackage-palate
          bash -n packages/package/remove/removepackage-palate

      - name: Test Palate Lifecycle
        run: python3 -m unittest discover -s tests -p 'test_palate_installer.py' -v

  jellyseerr-installer:
    name: Jellyseerr / Seerr Installer Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Installer Syntax
        run: bash -n packages/package/install/installpackage-jellyseerr

      - name: Test Upgrade and Rollback
        run: python3 -m unittest discover -s tests -p 'test_jellyseerr_installer.py' -v

  release-lifecycle-smoke:
    name: v4 Release, Bootstrap, OS Matrix & Lifecycle Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install SQLite & Shell Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 bc curl ca-certificates python3-yaml

      - name: Run Deterministic v4 Release Lifecycle & OS Matrix Smoke Harness
        run: |
          bash scripts/smoke_v4_release_lifecycle.sh

      - name: Run Release, Build Tools & Bootstrap Regression Suite
        run: |
          python3 -m unittest discover -s tests -p 'test_rust_build_tools.py' -v
          python3 -m unittest discover -s tests -p 'test_release_manager.py' -v
          python3 -m unittest discover -s tests -p 'test_v4_release_bootstrap_ci.py' -v
          python3 tests/check_shell_hygiene.py

  frontend:
    name: Frontend (Next.js Static Export & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        working-directory: .
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Typecheck Frontend and Tests
        run: ../node_modules/.bin/tsc --noEmit --incremental false

      - name: Unit Tests
        run: npm run test:ci

      - name: Static Export Build
        env:
          NEXT_STATIC_EXPORT: "1"
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-static-export
          path: frontend/out
          if-no-files-found: error

  backend-rs:
    name: Backend & Single-Binary Bundle (Rust)
    runs-on: ubuntu-22.04
    needs: frontend
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Mold Linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang pkg-config libssl-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "backend-rs -> target"
          cache-targets: "false"

      - name: Download Frontend Static Export (Neutral Staging)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-static-export
          path: web/dist

      - name: Verify Zero-Go Repository Hygiene
        working-directory: .
        run: |
          test -z "$(git ls-files '*.go' '*go.mod' '*go.sum')"

      - name: Verify Workspace Lockfile & Run Unit Tests (Rust Workspace)
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
          AETHERFLOW_DISABLE_BACKGROUND_WORKERS: "1"
          TMPDIR: /tmp
        run: |
          test -f Cargo.lock
          cargo test --workspace --locked -- --test-threads=1

      - name: Enforce Strict Clippy on Restore & Release Core Crates
        run: |
          cargo clippy --no-deps -p af-models -p af-host -p af-release -p af-cli -p af-librespeed --all-targets --locked -- -D warnings

      - name: Enforce Workspace Clippy Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Enforce Rust Formatting Gate
        run: cargo fmt --all -- --check

      - name: Build Embedded Single-Binary & Native CLI (Rust)
        run: |
          cargo build --release --locked --bin aetherflow-api --bin af --bin speedtest-backend

      - name: Upload Rust Single-Binary & CLI Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aetherflow-rs-single-binary
          path: |
            backend-rs/target/release/aetherflow-api
            backend-rs/target/release/af
            backend-rs/target/release/speedtest-backend
          if-no-files-found: error

  embedded-e2e:
    name: Embedded Rust Single-Binary Full-Stack E2E
    runs-on: ubuntu-22.04
    needs: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node (for Playwright Client Runner)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Rust Single-Binary & CLI Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aetherflow-rs-single-binary
          path: backend-rs/target/release

      - name: Make Compiled Binaries Executable
        run: |
          chmod +x backend-rs/target/release/aetherflow-api backend-rs/target/release/af backend-rs/target/release/speedtest-backend

      - name: Install Playwright Chromium Browser
        run: |
          npm ci
          cd frontend
          npx playwright install --with-deps chromium

      - name: Execute Embedded Single-Binary Full-Stack & Playwright E2E
        env:
          CI: "true"
        run: |
          bash scripts/run_embedded_e2e.sh --binary "${PWD}/backend-rs/target/release/aetherflow-api" --port 18080 --playwright
