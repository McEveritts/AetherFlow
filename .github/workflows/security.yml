name: Security Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - development
      - nightly
      - Nightly
  pull_request:
    branches:
      - main
      - master
      - development
      - nightly
      - Nightly

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Credential Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks binary and scan working tree + git history
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f /tmp/gitleaks.tar.gz
          gitleaks dir . --verbose --redact
          gitleaks git . --verbose --redact

  rust-security:
    name: Rust Control Plane SAST & Advisory Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold clang pkg-config libssl-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "backend-rs -> target"
          cache-targets: "false"

      - name: Prepare Embedded Frontend Staging Directories
        working-directory: .
        run: |
          mkdir -p web/dist backend/web/dist
          touch web/dist/.keep backend/web/dist/.keep

      - name: Verify Workspace Lockfile Presence
        run: |
          test -f Cargo.lock
          test -f deny.toml

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit, cargo-deny

      - name: Rust Advisory & Supply-Chain Policy (cargo-deny)
        run: |
          cargo deny --locked check advisories bans sources

      - name: RustSec Vulnerability Scan (cargo-audit)
        run: |
          cargo audit --file Cargo.lock

      - name: Rust Static Analysis (workspace + strict restore/release core)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --no-deps -p af-models -p af-host -p af-release -p af-cli --all-targets --locked -- -D warnings

      - name: Rust Security Unit & Contract Tests
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
          AETHERFLOW_DISABLE_BACKGROUND_WORKERS: "1"
          TMPDIR: /tmp
        run: |
          cargo test --workspace --locked -- --test-threads=1

  security-checks:
    name: Legacy Go Backend SAST & Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install pinned Go security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Dependency verification
        run: |
          go mod verify

      - name: Vulnerability scan (govulncheck)
        run: govulncheck ./...

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: staticcheck ./...

      - name: gosec (SAST)
        run: gosec -severity high -confidence high ./...

      - name: Unit & integration tests
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
          TMPDIR: /tmp
        run: go test -v -count=1 -race ./...

      - name: Build verification
        run: go build ./...
