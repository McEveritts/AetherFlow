name: Security Gate

on:
  workflow_dispatch:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Credential Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install and run gitleaks on working tree
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --verbose --redact

  security-checks:
    name: Backend SAST & Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Dependency verification
        run: |
          go mod tidy
          go mod verify

      - name: Vulnerability scan (govulncheck)
        run: govulncheck ./... || true

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: staticcheck ./... || true

      - name: gosec (SAST)
        run: gosec -severity high -confidence high ./... || true

      - name: Unit & integration tests
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          REDIS_ADDR: localhost:6379
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
        run: go test -v -count=1 -race ./...

      - name: Build verification
        run: go build ./...
