name: Security Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches:
      - main
      - master
      - development
      - nightly
      - Nightly
  pull_request:
    branches:
      - main
      - master
      - development
      - nightly
      - Nightly

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Credential Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks binary and scan working tree + git history
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f /tmp/gitleaks.tar.gz
          gitleaks dir . --verbose --redact
          gitleaks git . --verbose --redact

  rust-security:
    name: Rust Control Plane SAST & Advisory Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold clang pkg-config libssl-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # compiler version pinned below
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "backend-rs -> target"
          cache-targets: "false"

      - name: Verify Zero-Go Repository Hygiene
        working-directory: .
        run: |
          test -z "$(git ls-files '*.go' '*go.mod' '*go.sum')"

      - name: Verify Workspace Lockfile Presence
        run: |
          test -f Cargo.lock
          test -f deny.toml

      - name: Install cargo-audit, cargo-deny and cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2, cargo-deny@0.20.2, cargo-nextest@0.9.151

      - name: Rust Advisory & Supply-Chain Policy (cargo-deny)
        run: |
          cargo deny --locked check advisories bans licenses sources
          cargo deny --manifest-path ../plugins/sdk-template-rust/backend/Cargo.toml --config deny.toml --locked check advisories bans licenses sources

      - name: RustSec Vulnerability Scan (cargo-audit)
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file ../plugins/sdk-template-rust/backend/Cargo.lock

      - name: Rust Static Analysis (workspace + strict restore/release core)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --no-deps -p af-models -p af-host -p af-release -p af-cli -p af-librespeed --all-targets --locked -- -D warnings

      - name: Verify Pure-Rust Plugin SDK & Generated Scaffold (--locked)
        working-directory: .
        run: |
          test -f plugins/sdk-template-rust/backend/Cargo.lock
          cargo fmt --manifest-path plugins/sdk-template-rust/backend/Cargo.toml -- --check
          cargo clippy --manifest-path plugins/sdk-template-rust/backend/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path plugins/sdk-template-rust/backend/Cargo.toml --locked
          TMP_SDK="$(mktemp -d)"
          trap 'rm -rf "$TMP_SDK"' EXIT
          bash scripts/create-plugin-sdk.sh sec-verify-plugin "Security Verify Plugin" "$TMP_SDK/sec-verify-plugin" rust
          cargo clippy --manifest-path "$TMP_SDK/sec-verify-plugin/backend/Cargo.toml" --all-targets --locked -- -D warnings
          cargo test --manifest-path "$TMP_SDK/sec-verify-plugin/backend/Cargo.toml" --locked

      - name: Rust Security Unit & Contract Tests
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
          AETHERFLOW_DISABLE_BACKGROUND_WORKERS: "1"
          TMPDIR: /tmp
        run: |
          cargo nextest run --workspace --locked --no-fail-fast
          cargo test --workspace --doc --locked

  frontend-rs-security:
    name: Rust WASM Frontend SAST & Advisory Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # compiler version pinned below
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "frontend-rs -> target"
          cache-targets: "false"

      - name: Install cargo-audit, cargo-deny and cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2, cargo-deny@0.20.2, cargo-nextest@0.9.151

      - name: Verify Rust WASM Frontend Security
        run: |
          cargo fmt --manifest-path frontend-rs/Cargo.toml --all -- --check
          cargo clippy --manifest-path frontend-rs/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path frontend-rs/Cargo.toml --workspace --target wasm32-unknown-unknown --locked -- -D warnings
          cargo deny --manifest-path frontend-rs/Cargo.toml --locked check advisories bans licenses sources
          cargo audit --file frontend-rs/Cargo.lock
          python3 scripts/finalize_wasm_assets.py --self-test

      - name: Rust WASM Frontend Workspace Unit Tests
        run: cargo test --manifest-path frontend-rs/Cargo.toml --workspace --locked

  npm-security:
    name: Monorepo NPM Production Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Audit root and workspace production dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --workspaces --include-workspace-root --omit=dev --audit-level=high
