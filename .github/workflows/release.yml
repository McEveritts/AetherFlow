name: Production Release Pipeline

on:
  push:
    branches:
      - nightly
      - Nightly
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Branch channel to publish; run on the matching branch. Version tags publish their exact version.'
        required: true
        type: choice
        default: 'nightly'
        options:
          - nightly
          - experimental

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-build:
    name: Build, Verify & Publish Signed Release (Rust Control Plane)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Identity
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_CHANNEL="${GITHUB_REF_NAME,,}"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REQUESTED_CHANNEL}" != "${RELEASE_CHANNEL}" ]]; then
              echo "Run this workflow on the selected ${REQUESTED_CHANNEL} branch." >&2
              exit 1
            fi
            case "${RELEASE_CHANNEL}" in
              nightly|experimental) ;;
              *) echo "Unsupported release branch: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
            esac
            REPO_VERSION="$(tr -d '[:space:]' < .version)"
            if [[ ! "${REPO_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid base release version: ${REPO_VERSION}" >&2
              exit 1
            fi
            RELEASE_TAG="${REPO_VERSION}-${RELEASE_CHANNEL}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          printf 'RELEASE_TAG=%s\nVERSION_STAMP=%s\n' "${RELEASE_TAG}" "${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Test Release Routing
        run: python3 -m unittest discover -s tests -p 'test_release_workflow.py' -v

      - name: Test YouTube Marketplace Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-yaml apache2-bin jq
          bash -n packages/youtube-common.sh
          for app in invidious piped; do
            bash -n "packages/package/install/installpackage-${app}"
            bash -n "packages/package/remove/removepackage-${app}"
          done
          PATH="/usr/sbin:$PATH" /usr/bin/python3 -m unittest discover -s tests -p 'test_youtube_packages.py' -v

      - name: Secret Scan (Gitleaks Gate)
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --verbose --redact

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install mold Fast Linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold pkg-config libssl-dev

      - name: Rust Cargo Dependency Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend-rs -> target"

      - name: Build Next.js Static Export
        env:
          NEXT_STATIC_EXPORT: "1"
        run: |
          npm ci
          cd frontend
          npm run lint
          npm run test:ci
          npm run build

      - name: Stage Embedded Frontend Assets
        run: |
          rm -rf backend/web/dist
          mkdir -p backend/web/dist
          cp -R frontend/out/. backend/web/dist/

      - name: Run Rust Workspace Unit & Contract Tests
        working-directory: backend-rs
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
        run: |
          cargo test --workspace --locked || cargo test --workspace

      - name: Verify Updater Survives Its Caller Restart
        working-directory: backend-rs
        run: |
          test_binary=$(cargo test -p af-runner --lib --no-run --message-format=json | python3 -c 'import json,sys; artifacts=[json.loads(line) for line in sys.stdin if line.startswith("{")]; binaries=[item["executable"] for item in artifacts if item.get("reason")=="compiler-artifact" and item.get("executable") and item["target"]["name"]=="af_runner"]; assert len(binaries)==1; print(binaries[0])')
          sudo "$test_binary" self_update::tests::updater_survives_caller_restart --ignored --exact --nocapture

      - name: Package Single-Binary Release Tarball & SHA-256 Manifest
        run: |
          STAGE_DIR="$(mktemp -d)"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"

          cd backend-rs
          cargo build --release --bin aetherflow-api --bin af
          cp target/release/aetherflow-api "${STAGE_DIR}/aetherflow-api"
          cp target/release/af "${STAGE_DIR}/af"
          cd ..

          cp -R backend/config "${STAGE_DIR}/config"
          cp -R packages "${STAGE_DIR}/packages"
          cp -R deploy "${STAGE_DIR}/deploy"
          echo "${VERSION_STAMP}" > "${STAGE_DIR}/.version"
          chmod +x "${STAGE_DIR}/aetherflow-api" "${STAGE_DIR}/af" "${STAGE_DIR}/deploy/release-manager.sh"

          mkdir -p release-dist
          tar -C "${STAGE_DIR}" -czf release-dist/aetherflow-linux-amd64.tar.gz .
          (cd release-dist && sha256sum aetherflow-linux-amd64.tar.gz > SHA256SUMS)

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-dist/aetherflow-linux-amd64.tar.gz'

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_FLAGS=(--generate-notes)
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            RELEASE_FLAGS=(
              --prerelease
              --latest=false
              --notes "Automated ${RELEASE_TAG} pre-release built from commit ${GITHUB_SHA}."
            )
          fi
          gh release create "${RELEASE_TAG}" \
            release-dist/aetherflow-linux-amd64.tar.gz \
            release-dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "AetherFlow ${RELEASE_TAG} (${GITHUB_SHA::8})" \
            "${RELEASE_FLAGS[@]}"
