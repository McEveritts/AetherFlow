name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel to publish (stable, beta, nightly)'
        required: false
        default: 'nightly'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-build:
    name: Build, Verify & Publish Signed Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks Gate)
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --verbose --redact

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Next.js Static Export
        env:
          NEXT_STATIC_EXPORT: "1"
        run: |
          npm ci
          cd frontend
          npm run lint
          npm run test:ci
          npm run build

      - name: Stage Embedded Frontend Assets
        run: |
          rm -rf backend/web/dist
          mkdir -p backend/web/dist
          cp -R frontend/out/. backend/web/dist/

      - name: Run Backend Security & Unit Tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Package Single-Binary Release Tarball & SHA-256 Manifest
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="nightly"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

          STAGE_DIR="$(mktemp -d)"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"

          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${RELEASE_TAG}" \
            -o "${STAGE_DIR}/aetherflow-api" .
          cd ..

          cp -R backend/config "${STAGE_DIR}/config"
          cp -R packages "${STAGE_DIR}/packages"
          cp -R deploy "${STAGE_DIR}/deploy"
          echo "${RELEASE_TAG}" > "${STAGE_DIR}/.version"
          chmod +x "${STAGE_DIR}/aetherflow-api" "${STAGE_DIR}/deploy/release-manager.sh"

          mkdir -p release-dist
          tar -C "${STAGE_DIR}" -czf release-dist/aetherflow-linux-amd64.tar.gz .
          (cd release-dist && sha256sum aetherflow-linux-amd64.tar.gz > SHA256SUMS)

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-dist/aetherflow-linux-amd64.tar.gz'

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${RELEASE_TAG}" == "nightly" ]]; then
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly \
              release-dist/aetherflow-linux-amd64.tar.gz \
              release-dist/SHA256SUMS \
              --title "AetherFlow Nightly (${GITHUB_SHA::8})" \
              --notes "Automated pull-pipeline nightly build from commit ${GITHUB_SHA}." \
              --prerelease
          else
            PRERELEASE_FLAG=""
            if [[ "${RELEASE_TAG}" == *-* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              gh release upload "${RELEASE_TAG}" \
                release-dist/aetherflow-linux-amd64.tar.gz \
                release-dist/SHA256SUMS \
                --clobber
            else
              gh release create "${RELEASE_TAG}" \
                release-dist/aetherflow-linux-amd64.tar.gz \
                release-dist/SHA256SUMS \
                --title "AetherFlow ${RELEASE_TAG}" \
                --generate-notes \
                ${PRERELEASE_FLAG}
            fi
          fi
