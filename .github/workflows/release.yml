name: Production Release Pipeline

on:
  push:
    branches:
      - experimental
      - nightly
      - Nightly
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel to publish (stable, beta, nightly, experimental)'
        required: false
        default: 'experimental'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-build:
    name: Build, Verify & Publish Signed Release (Rust Control Plane)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks Gate)
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --verbose --redact

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install mold Fast Linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold pkg-config libssl-dev

      - name: Rust Cargo Dependency Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend-rs -> target"

      - name: Build Next.js Static Export
        env:
          NEXT_STATIC_EXPORT: "1"
        run: |
          npm ci
          cd frontend
          npm run lint
          npm run test:ci
          npm run build

      - name: Stage Embedded Frontend Assets
        run: |
          rm -rf backend/web/dist
          mkdir -p backend/web/dist
          cp -R frontend/out/. backend/web/dist/

      - name: Run Rust Workspace Unit & Contract Tests
        working-directory: backend-rs
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
        run: |
          cargo test --workspace --locked || cargo test --workspace

      - name: Package Single-Binary Release Tarball & SHA-256 Manifest
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            VERSION_STAMP="${RELEASE_TAG}"
          elif [[ "${GITHUB_REF_NAME}" == "experimental" ]]; then
            RELEASE_TAG="experimental"
            VERSION_STAMP="experimental-${GITHUB_SHA::7}"
          else
            REPO_VERSION="$(tr -d '[:space:]' < .version 2>/dev/null || true)"
            if [[ "${REPO_VERSION}" == v* ]]; then
              RELEASE_TAG="${REPO_VERSION}"
              VERSION_STAMP="${REPO_VERSION}"
            else
              RELEASE_TAG="nightly"
              VERSION_STAMP="nightly-${GITHUB_SHA::7}"
            fi
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

          STAGE_DIR="$(mktemp -d)"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"

          cd backend-rs
          cargo build --release --bin aetherflow-api
          cp target/release/aetherflow-api "${STAGE_DIR}/aetherflow-api"
          cd ..

          cp -R backend/config "${STAGE_DIR}/config"
          cp -R packages "${STAGE_DIR}/packages"
          cp -R deploy "${STAGE_DIR}/deploy"
          echo "${VERSION_STAMP}" > "${STAGE_DIR}/.version"
          chmod +x "${STAGE_DIR}/aetherflow-api" "${STAGE_DIR}/deploy/release-manager.sh"

          mkdir -p release-dist
          tar -C "${STAGE_DIR}" -czf release-dist/aetherflow-linux-amd64.tar.gz .
          (cd release-dist && sha256sum aetherflow-linux-amd64.tar.gz > SHA256SUMS)

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-dist/aetherflow-linux-amd64.tar.gz'

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${RELEASE_TAG}" == "experimental" ]]; then
            gh release delete experimental --yes --cleanup-tag 2>/dev/null || true
            gh release create experimental \
              release-dist/aetherflow-linux-amd64.tar.gz \
              release-dist/SHA256SUMS \
              --title "AetherFlow Experimental Rust (${GITHUB_SHA::8})" \
              --notes "Automated experimental Rust single-binary build from commit ${GITHUB_SHA}." \
              --prerelease
          elif [[ "${RELEASE_TAG}" == "nightly" ]]; then
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly \
              release-dist/aetherflow-linux-amd64.tar.gz \
              release-dist/SHA256SUMS \
              --title "AetherFlow Nightly (${GITHUB_SHA::8})" \
              --notes "Automated pull-pipeline nightly build from commit ${GITHUB_SHA}." \
              --prerelease
          else
            PRERELEASE_FLAG=""
            if [[ "${RELEASE_TAG}" == *-* || "${GITHUB_REF_NAME}" == "nightly" || "${GITHUB_REF_NAME}" == "Nightly" || "${GITHUB_REF_NAME}" == "experimental" ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              gh release upload "${RELEASE_TAG}" \
                release-dist/aetherflow-linux-amd64.tar.gz \
                release-dist/SHA256SUMS \
                --clobber
            else
              gh release create "${RELEASE_TAG}" \
                release-dist/aetherflow-linux-amd64.tar.gz \
                release-dist/SHA256SUMS \
                --title "AetherFlow ${RELEASE_TAG}" \
                --generate-notes \
                ${PRERELEASE_FLAG}
            fi
          fi
