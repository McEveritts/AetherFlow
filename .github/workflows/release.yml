name: Production Release Pipeline

on:
  push:
    branches:
      - nightly
      - Nightly
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Branch channel to publish; run on the matching branch. Version tags publish their exact version.'
        required: true
        type: choice
        default: 'nightly'
        options:
          - nightly

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Identity & Channel Contracts
    if: github.ref == 'refs/heads/nightly' || github.ref == 'refs/heads/Nightly' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve_identity.outputs.release_tag }}
      version_stamp: ${{ steps.resolve_identity.outputs.version_stamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Release Identity
        id: resolve_identity
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            if [[ ! "${RELEASE_TAG}" =~ ^v([4-9]|[1-9][0-9]+)\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([._-][A-Za-z0-9]+)*)?$ ]]; then
              echo "Unsupported pre-v4 or malformed release tag: ${RELEASE_TAG}" >&2
              exit 1
            fi
          else
            RELEASE_CHANNEL="${GITHUB_REF_NAME,,}"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REQUESTED_CHANNEL}" != "${RELEASE_CHANNEL}" ]]; then
              echo "Run this workflow on the selected ${REQUESTED_CHANNEL} branch." >&2
              exit 1
            fi
            case "${RELEASE_CHANNEL}" in
              nightly) ;;
              *) echo "Unsupported release branch: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
            esac
            REPO_VERSION="$(tr -d '[:space:]' < .version)"
            if [[ ! "${REPO_VERSION}" =~ ^v([4-9]|[1-9][0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid base release version: ${REPO_VERSION}" >&2
              exit 1
            fi
            RELEASE_TAG="${REPO_VERSION}-${RELEASE_CHANNEL}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          printf 'RELEASE_TAG=%s\nVERSION_STAMP=%s\n' "${RELEASE_TAG}" "${RELEASE_TAG}" >> "$GITHUB_ENV"
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            printf 'release_tag=%s\nversion_stamp=%s\n' "${RELEASE_TAG}" "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Confirm Release Identity
        run: |
          echo "Resolved release identity: ${RELEASE_TAG} (${VERSION_STAMP})"

      - name: Test Release Routing, Provenance & Security Regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_release*.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_provenance.py' -v
          python3 -m unittest discover -s tests -p 'test_modern_stack_env.py' -v
          python3 -m unittest discover -s tests -p 'test_round3_security_regressions.py' -v

  security-gate:
    name: Release Security, SAST & Advisory Gate
    needs: [validate-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Shell Hygiene & Full Python Verification Suite
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-yaml apache2-bin jq sqlite3 bc
          python3 tests/check_shell_hygiene.py
          PATH="$PATH:/usr/sbin" /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Secret Scan (Gitleaks Gate)
        working-directory: .
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f /tmp/gitleaks.tar.gz
          gitleaks dir . --verbose --redact
          gitleaks git . --verbose --redact

      - name: Setup Node for Production Dependency Audit
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: NPM Production Dependency Security Audit
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npm audit --workspaces --include-workspace-root --omit=dev --audit-level=high

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold clang pkg-config libssl-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cargo Dependency Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "backend-rs -> target"
          cache-targets: "false"

      - name: Prepare Embedded Frontend Staging Directories
        working-directory: .
        run: |
          mkdir -p web/dist
          touch web/dist/.keep

      - name: Verify Zero-Go Repository Hygiene
        working-directory: .
        run: |
          test -z "$(git ls-files '*.go' '*go.mod' '*go.sum')"

      - name: Verify Workspace Lockfile & Advisory Policy Presence
        run: |
          test -f Cargo.lock
          test -f deny.toml

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2, cargo-deny@0.20.2

      - name: Rust Advisory & Supply-Chain Policy (cargo-deny)
        run: |
          cargo deny --locked check advisories bans licenses sources
          cargo deny --manifest-path ../plugins/sdk-template-rust/backend/Cargo.toml --config deny.toml --locked check advisories bans licenses sources

      - name: RustSec Vulnerability Scan (cargo-audit)
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file ../plugins/sdk-template-rust/backend/Cargo.lock

      - name: Rust Static Analysis (workspace + strict restore/release core)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --no-deps -p af-models -p af-host -p af-release -p af-cli -p af-librespeed --all-targets --locked -- -D warnings

      - name: Verify Pure-Rust Plugin SDK & Generated Scaffold (--locked)
        working-directory: .
        run: |
          test -f plugins/sdk-template-rust/backend/Cargo.lock
          cargo fmt --manifest-path plugins/sdk-template-rust/backend/Cargo.toml -- --check
          cargo clippy --manifest-path plugins/sdk-template-rust/backend/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path plugins/sdk-template-rust/backend/Cargo.toml --locked
          TMP_SDK="$(mktemp -d)"
          trap 'rm -rf "$TMP_SDK"' EXIT
          bash scripts/create-plugin-sdk.sh release-verify-plugin "Release Verify Plugin" "$TMP_SDK/release-verify-plugin" rust
          cargo clippy --manifest-path "$TMP_SDK/release-verify-plugin/backend/Cargo.toml" --all-targets --locked -- -D warnings
          cargo test --manifest-path "$TMP_SDK/release-verify-plugin/backend/Cargo.toml" --locked

      - name: Rust Security Unit & Contract Tests (--locked)
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
          AETHERFLOW_DISABLE_BACKGROUND_WORKERS: "1"
          TMPDIR: /tmp
        run: |
          cargo test --workspace --locked -- --test-threads=1

  release-build:
    name: Build & Verify Release Tarball (Rust Control Plane)
    needs: [validate-release, security-gate]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
      VERSION_STAMP: ${{ needs.validate-release.outputs.version_stamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test YouTube Marketplace Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-yaml apache2-bin jq
          bash -n packages/youtube-common.sh
          for app in invidious piped; do
            bash -n "packages/package/install/installpackage-${app}"
            bash -n "packages/package/remove/removepackage-${app}"
          done
          PATH="/usr/sbin:$PATH" /usr/bin/python3 -m unittest discover -s tests -p 'test_youtube_packages.py' -v

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf
          components: clippy

      - name: Install mold Fast Linker & ARM Cross Toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold clang pkg-config libssl-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Rust Cargo Dependency Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "backend-rs -> target"
          cache-targets: "false"

      - name: Build Next.js Static Export
        env:
          NEXT_STATIC_EXPORT: "1"
        run: |
          npm ci
          cd frontend
          npm run lint
          ../node_modules/.bin/tsc --noEmit --incremental false
          npm run test:ci
          npm run build

      - name: Stage Embedded Frontend Assets (Neutral Staging)
        run: |
          rm -rf web/dist
          mkdir -p web/dist
          cp -R frontend/out/. web/dist/

      - name: Run Rust Workspace Unit & Contract Tests (--locked)
        working-directory: backend-rs
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
          AETHERFLOW_DISABLE_BACKGROUND_WORKERS: "1"
          TMPDIR: /tmp
        run: |
          test -f Cargo.lock
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --no-deps -p af-models -p af-host -p af-release -p af-cli -p af-librespeed --all-targets --locked -- -D warnings
          cargo test --workspace --locked -- --test-threads=1

      - name: Verify Updater Survives Its Caller Restart
        working-directory: backend-rs
        run: |
          test_binary=$(cargo test -p af-runner --lib --no-run --message-format=json | python3 -c 'import json,sys; artifacts=[json.loads(line) for line in sys.stdin if line.startswith("{")]; binaries=[item["executable"] for item in artifacts if item.get("reason")=="compiler-artifact" and item.get("executable") and item["target"]["name"]=="af_runner"]; assert len(binaries)==1; print(binaries[0])')
          sudo "$test_binary" self_update::tests::updater_survives_caller_restart --ignored --exact --nocapture

      - name: Package Single-Binary Release Tarball & SHA-256 Manifest
        run: |
          STAGE_DIR="$(mktemp -d)"
          chmod 0755 "${STAGE_DIR}"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"

          cd backend-rs
          export AF_BUILD_VERSION="${RELEASE_TAG#v}"
          cargo build --release --locked --bin aetherflow-api --bin af --bin speedtest-backend
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS="" \
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --locked --target aarch64-unknown-linux-gnu -p af-librespeed --bin speedtest-backend
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS="" \
            CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc \
            cargo build --release --locked --target armv7-unknown-linux-gnueabihf -p af-librespeed --bin speedtest-backend
          cp target/release/aetherflow-api "${STAGE_DIR}/aetherflow-api"
          cp target/release/af "${STAGE_DIR}/af"
          cp target/release/speedtest-backend "${STAGE_DIR}/speedtest-backend"
          mkdir -p "${STAGE_DIR}/bin"
          cp target/release/af "${STAGE_DIR}/bin/af"
          cp target/release/speedtest-backend "${STAGE_DIR}/bin/speedtest-backend"
          cd ..

          cp -R config "${STAGE_DIR}/config"
          cp -R packages "${STAGE_DIR}/packages"
          cp -R deploy "${STAGE_DIR}/deploy"
          rm -rf "${STAGE_DIR}/deploy/__pycache__"
          echo "${VERSION_STAMP}" > "${STAGE_DIR}/.version"
          chmod 0755 "${STAGE_DIR}/aetherflow-api" "${STAGE_DIR}/af" "${STAGE_DIR}/speedtest-backend" "${STAGE_DIR}/bin/af" "${STAGE_DIR}/bin/speedtest-backend" "${STAGE_DIR}/deploy/release-manager.sh" "${STAGE_DIR}/deploy/verify-provenance.py" "${STAGE_DIR}/deploy/log-retention.py"

          mkdir -p release-dist
          tar --owner=0 --group=0 --numeric-owner -C "${STAGE_DIR}" -czf release-dist/aetherflow-linux-amd64.tar.gz .

          package_speedtest_arch() {
            local src_bin="$1"
            local ls_arch="$2"
            local stage_sub
            stage_sub="$(mktemp -d)"
            cp "${src_bin}" "${stage_sub}/speedtest-backend"
            chmod 0755 "${stage_sub}/speedtest-backend"
            tar --owner=0 --group=0 --numeric-owner -C "${stage_sub}" -czf "release-dist/speedtest-backend_${RELEASE_TAG#v}_linux_${ls_arch}.tar.gz" speedtest-backend
            rm -rf "${stage_sub}"
          }
          package_speedtest_arch "${STAGE_DIR}/speedtest-backend" "amd64"
          package_speedtest_arch "backend-rs/target/aarch64-unknown-linux-gnu/release/speedtest-backend" "arm64"
          package_speedtest_arch "backend-rs/target/armv7-unknown-linux-gnueabihf/release/speedtest-backend" "armv7"

          (cd release-dist && sha256sum aetherflow-linux-amd64.tar.gz speedtest-backend_*_linux_*.tar.gz > SHA256SUMS)

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist
          path: |
            release-dist/aetherflow-linux-amd64.tar.gz
            release-dist/speedtest-backend_*_linux_*.tar.gz
            release-dist/SHA256SUMS
          if-no-files-found: error

  release-publish:
    name: Attest & Publish Signed Release
    if: github.ref == 'refs/heads/nightly' || github.ref == 'refs/heads/Nightly' || startsWith(github.ref, 'refs/tags/v')
    needs: [validate-release, security-gate, release-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Release Changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md

      - name: Download Release Bundle Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: release-dist

      - name: Verify Release Archive Integrity
        run: |
          (cd release-dist && sha256sum -c SHA256SUMS)

      - name: Attest Build Provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-dist/aetherflow-linux-amd64.tar.gz
            release-dist/speedtest-backend_*_linux_*.tar.gz
            release-dist/SHA256SUMS

      - name: Publish to GitHub Releases
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          ATTEST_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=(--generate-notes)
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            RELEASE_NOTES_FILE="$(mktemp)"
            trap 'rm -f "${RELEASE_NOTES_FILE}"' EXIT
            python3 - "${RELEASE_TAG}" "${GITHUB_SHA}" "${RELEASE_NOTES_FILE}" <<'PY'
          from pathlib import Path
          import sys

          release_tag, commit_sha, notes_file = sys.argv[1:]
          changelog = Path("CHANGELOG.md")
          if not changelog.is_file():
              raise SystemExit("A prerelease requires current patch notes in CHANGELOG.md.")
          notes = changelog.read_text(encoding="utf-8").split("\n---\n", 1)[0].strip()
          if not notes.startswith("## Nightly Patch Notes") or "\n" not in notes:
              raise SystemExit("The latest changelog section must contain nightly patch notes.")
          Path(notes_file).write_text(
              f"{notes}\n\nBuilt from commit `{commit_sha}` as `{release_tag}`.\n",
              encoding="utf-8",
          )
          PY
            RELEASE_FLAGS=(
              --prerelease
              --latest=false
              --notes-file "${RELEASE_NOTES_FILE}"
            )
          fi
          if [[ -z "${ATTEST_BUNDLE_PATH:-}" || ! -s "${ATTEST_BUNDLE_PATH}" ]]; then
            echo "::error::Missing or empty Sigstore attestation bundle from actions/attest-build-provenance" >&2
            exit 1
          fi
          RELEASE_ASSETS=(
            release-dist/aetherflow-linux-amd64.tar.gz
            release-dist/SHA256SUMS
          )
          cp -f "${ATTEST_BUNDLE_PATH}" release-dist/aetherflow-linux-amd64.tar.gz.sigstore.json
          RELEASE_ASSETS+=(release-dist/aetherflow-linux-amd64.tar.gz.sigstore.json)
          for extra_tar in release-dist/speedtest-backend_*_linux_*.tar.gz; do
            if [[ -f "${extra_tar}" ]]; then
              cp -f "${ATTEST_BUNDLE_PATH}" "${extra_tar}.sigstore.json"
              RELEASE_ASSETS+=("${extra_tar}" "${extra_tar}.sigstore.json")
            fi
          done
          gh release create "${RELEASE_TAG}" \
            "${RELEASE_ASSETS[@]}" \
            --target "${GITHUB_SHA}" \
            --title "AetherFlow ${RELEASE_TAG} (${GITHUB_SHA::8})" \
            "${RELEASE_FLAGS[@]}"
