name: Production Release Pipeline

on:
  push:
    branches:
      - nightly
      - Nightly
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Branch channel to publish; run on the matching branch. Version tags publish their exact version.'
        required: true
        type: choice
        default: 'nightly'
        options:
          - nightly

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Identity & Channel Contracts
    if: github.ref == 'refs/heads/nightly' || github.ref == 'refs/heads/Nightly' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve_identity.outputs.release_tag }}
      version_stamp: ${{ steps.resolve_identity.outputs.version_stamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Release Identity
        id: resolve_identity
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            if [[ ! "${RELEASE_TAG}" =~ ^v([4-9]|[1-9][0-9]+)\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([._-][A-Za-z0-9]+)*)?$ ]]; then
              echo "Unsupported pre-v4 or malformed release tag: ${RELEASE_TAG}" >&2
              exit 1
            fi
          else
            RELEASE_CHANNEL="${GITHUB_REF_NAME,,}"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REQUESTED_CHANNEL}" != "${RELEASE_CHANNEL}" ]]; then
              echo "Run this workflow on the selected ${REQUESTED_CHANNEL} branch." >&2
              exit 1
            fi
            case "${RELEASE_CHANNEL}" in
              nightly) ;;
              *) echo "Unsupported release branch: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
            esac
            REPO_VERSION="$(tr -d '[:space:]' < .version)"
            if [[ ! "${REPO_VERSION}" =~ ^v([4-9]|[1-9][0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid base release version: ${REPO_VERSION}" >&2
              exit 1
            fi
            RELEASE_TAG="${REPO_VERSION}-${RELEASE_CHANNEL}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          printf 'RELEASE_TAG=%s\nVERSION_STAMP=%s\n' "${RELEASE_TAG}" "${RELEASE_TAG}" >> "$GITHUB_ENV"
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            printf 'release_tag=%s\nversion_stamp=%s\n' "${RELEASE_TAG}" "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Confirm Release Identity
        run: |
          echo "Resolved release identity: ${RELEASE_TAG} (${VERSION_STAMP})"

      - name: Test Release Routing, Provenance & Security Regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_release*.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_provenance.py' -v
          python3 -m unittest discover -s tests -p 'test_modern_stack_env.py' -v
          python3 -m unittest discover -s tests -p 'test_round3_security_regressions.py' -v

  security-gate:
    name: Release Security, SAST & Advisory Gate
    needs: [validate-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Shell Hygiene & Full Python Verification Suite
        working-directory: .
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-yaml python3-tomlkit apache2-bin jq sqlite3 bc python3-toml python3.11 python3.11-venv
          python3 tests/check_shell_hygiene.py
          PATH="$PATH:/usr/sbin" /usr/bin/python3 tests/run_parallel_tests.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Secret Scan (Gitleaks Gate)
        working-directory: .
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f /tmp/gitleaks.tar.gz
          gitleaks dir . --verbose --redact
          gitleaks git . --verbose --redact

      - name: Setup Node for Production Dependency Audit
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: NPM Production Dependency Security Audit
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npm audit --workspaces --include-workspace-root --omit=dev --audit-level=high

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold clang pkg-config libssl-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # compiler version pinned below
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Rust Cargo Dependency Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            backend-rs -> target
            frontend-rs -> target
          cache-targets: "false"

      - name: Verify Zero-Go Repository Hygiene
        working-directory: .
        run: |
          test -z "$(git ls-files '*.go' '*go.mod' '*go.sum')"

      - name: Verify Workspace Lockfile & Advisory Policy Presence
        run: |
          test -f Cargo.lock
          test -f deny.toml

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2, cargo-deny@0.20.2

      - name: Verify Rust WASM Frontend
        working-directory: .
        run: |
          cargo fmt --manifest-path frontend-rs/Cargo.toml --all -- --check
          cargo clippy --manifest-path frontend-rs/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path frontend-rs/Cargo.toml --workspace --target wasm32-unknown-unknown --locked -- -D warnings
          cargo test --manifest-path frontend-rs/Cargo.toml --workspace --locked
          cargo deny --manifest-path frontend-rs/Cargo.toml --locked check advisories bans licenses sources
          cargo audit --file frontend-rs/Cargo.lock
          python3 scripts/finalize_wasm_assets.py --self-test

      - name: Rust Advisory & Supply-Chain Policy (cargo-deny)
        run: |
          cargo deny --locked check advisories bans licenses sources
          cargo deny --manifest-path ../plugins/sdk-template-rust/backend/Cargo.toml --config deny.toml --locked check advisories bans licenses sources

      - name: RustSec Vulnerability Scan (cargo-audit)
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file ../plugins/sdk-template-rust/backend/Cargo.lock

      - name: Rust Static Analysis (workspace + strict restore/release core)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --no-deps -p af-models -p af-host -p af-release -p af-cli -p af-librespeed --all-targets --locked -- -D warnings

      - name: Verify Pure-Rust Plugin SDK & Generated Scaffold (--locked)
        working-directory: .
        run: |
          test -f plugins/sdk-template-rust/backend/Cargo.lock
          cargo fmt --manifest-path plugins/sdk-template-rust/backend/Cargo.toml -- --check
          cargo clippy --manifest-path plugins/sdk-template-rust/backend/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path plugins/sdk-template-rust/backend/Cargo.toml --locked
          TMP_SDK="$(mktemp -d)"
          trap 'rm -rf "$TMP_SDK"' EXIT
          bash scripts/create-plugin-sdk.sh release-verify-plugin "Release Verify Plugin" "$TMP_SDK/release-verify-plugin" rust
          cargo clippy --manifest-path "$TMP_SDK/release-verify-plugin/backend/Cargo.toml" --all-targets --locked -- -D warnings
          cargo test --manifest-path "$TMP_SDK/release-verify-plugin/backend/Cargo.toml" --locked

      - name: Rust Security Unit & Contract Tests (--locked)
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
          AETHERFLOW_DISABLE_BACKGROUND_WORKERS: "1"
          TMPDIR: /tmp
        run: |
          cargo test --workspace --locked -- --test-threads=1

  release-build:
    name: Build & Verify Release Tarball (Rust Control Plane)
    needs: [validate-release, security-gate]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
      VERSION_STAMP: ${{ needs.validate-release.outputs.version_stamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test YouTube Marketplace Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-yaml apache2-bin jq
          bash -n packages/youtube-common.sh
          for app in invidious piped; do
            bash -n "packages/package/install/installpackage-${app}"
            bash -n "packages/package/remove/removepackage-${app}"
          done
          PATH="/usr/sbin:$PATH" /usr/bin/python3 -m unittest discover -s tests -p 'test_youtube_packages.py' -v

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # compiler version pinned below
        with:
          toolchain: "1.99.1"
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf, wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install mold Fast Linker & ARM Cross Toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mold clang pkg-config libssl-dev \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Rust Cargo Dependency Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            backend-rs -> target
            frontend-rs -> target
          cache-targets: "false"

      - name: Typecheck Playwright E2E Suite
        run: |
          npm ci
          cd e2e
          ../node_modules/.bin/tsc --noEmit --incremental false

      - name: Install Pinned WASM Build Tools (SHA-256 Verified)
        working-directory: .
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/wasm-tools"
          WASM_TOOL_DIR="${tool_dir}" bash scripts/install_wasm_build_tools.sh
          echo "${tool_dir}/bin" >> "${GITHUB_PATH}"
          echo "WASM_TOOL_DIR=${tool_dir}" >> "${GITHUB_ENV}"

      - name: Run Rust Workspace Unit & Contract Tests (--locked)
        working-directory: backend-rs
        env:
          JWT_SECRET: ci-test-secret-exactly-32bytes!!
          AES_MASTER_KEY: ci-test-aes-key-exactly-32bytes!
          ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
          AETHERFLOW_DISABLE_BACKGROUND_WORKERS: "1"
          TMPDIR: /tmp
        run: |
          test -f Cargo.lock
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --no-deps -p af-models -p af-host -p af-release -p af-cli -p af-librespeed --all-targets --locked -- -D warnings
          cargo test --workspace --locked -- --test-threads=1

      - name: Verify Updater Survives Its Caller Restart
        working-directory: backend-rs
        run: |
          test_binary=$(cargo test -p af-runner --lib --locked --no-run --message-format=json | python3 -c 'import json,sys; artifacts=[json.loads(line) for line in sys.stdin if line.startswith("{")]; binaries=[item["executable"] for item in artifacts if item.get("reason")=="compiler-artifact" and item.get("executable") and item["target"]["name"]=="af_runner"]; assert len(binaries)==1; print(binaries[0])')
          sudo "$test_binary" tests::updater_survives_caller_restart --ignored --exact --nocapture

      - name: Stage External WASM Frontend Assets
        run: bash scripts/build_wasm_frontend.sh --stage

      - name: Package Release Tarball & SHA-256 Manifest
        run: |
          BUILD_FRONTEND=0 RUN_TESTS=0 PACKAGE_RELEASE=1 BUILD_CLI=1 BUILD_SPEEDTEST=1 \
            TARGETS=amd64 OUTPUT_DIR="${PWD}/release-dist" VERSION="${VERSION_STAMP}" \
            bash scripts/build_gold.sh

      - name: Package ARM64 Release Tarball
        run: |
          BUILD_FRONTEND=0 RUN_TESTS=0 PACKAGE_RELEASE=1 BUILD_CLI=1 BUILD_SPEEDTEST=1 \
            TARGETS=arm64 OUTPUT_DIR="${PWD}/release-dist-arm64" VERSION="${VERSION_STAMP}" \
            bash scripts/build_gold.sh
          cp -f release-dist-arm64/aetherflow-linux-arm64.tar.gz release-dist/aetherflow-linux-arm64.tar.gz
          cp -rf release-dist-arm64/linux-arm64 release-dist/linux-arm64

      - name: Build and Package Standalone Rust LibreSpeed Archives
        run: |
          set -euo pipefail
          export AF_BUILD_VERSION="${RELEASE_TAG#v}"
          SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(git show -s --format=%ct HEAD)}"
          (
            cd backend-rs
            export RUSTFLAGS="-C link-arg=-Wl,--as-needed"
            CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
              cargo build --release --locked --target aarch64-unknown-linux-gnu -p af-librespeed --bin speedtest-backend
            CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc \
              CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc \
              cargo build --release --locked --target armv7-unknown-linux-gnueabihf -p af-librespeed --bin speedtest-backend
          )

          stage="$(mktemp -d)"
          trap 'rm -rf "${stage}"' EXIT
          speedtest_archives=()
          package_speedtest() {
            local binary="$1" arch="$2"
            local archive="speedtest-backend_${AF_BUILD_VERSION}_linux_${arch}.tar.gz"
            install -m 0755 "${binary}" "${stage}/speedtest-backend"
            tar --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
              -C "${stage}" -cf - speedtest-backend | gzip -n -c > "release-dist/${archive}"
            speedtest_archives+=("${archive}")
          }
          package_speedtest "release-dist/linux-amd64/speedtest-backend" amd64
          package_speedtest "backend-rs/target/aarch64-unknown-linux-gnu/release/speedtest-backend" arm64
          package_speedtest "backend-rs/target/armv7-unknown-linux-gnueabihf/release/speedtest-backend" armv7
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git archive --format=tar.gz --prefix=AetherFlow/ HEAD > release-dist/aetherflow-bootstrap.tar.gz
          fi
          release_archives=(aetherflow-linux-amd64.tar.gz)
          if [[ -s release-dist/aetherflow-linux-arm64.tar.gz ]]; then
            release_archives+=(aetherflow-linux-arm64.tar.gz)
          fi
          if [[ -s release-dist/aetherflow-bootstrap.tar.gz ]]; then
            release_archives+=(aetherflow-bootstrap.tar.gz)
          fi
          (cd release-dist && sha256sum "${release_archives[@]}" "${speedtest_archives[@]}" > SHA256SUMS)

      - name: Install Playwright Browser Engines for Release Verification
        run: |
          cd e2e
          npx playwright install --with-deps chromium firefox webkit

      - name: Execute Live E2E Against Extracted Release Artifact
        env:
          CI: "true"
        run: |
          RELEASE_E2E_DIR="$(mktemp -d "${RUNNER_TEMP}/aetherflow-release-e2e.XXXXXX")"
          trap 'rm -rf "${RELEASE_E2E_DIR}"' EXIT
          (cd release-dist && sha256sum --strict --check SHA256SUMS)
          tar -xzf release-dist/aetherflow-linux-amd64.tar.gz -C "${RELEASE_E2E_DIR}"
          for binary in aetherflow-api af bin/af speedtest-backend bin/speedtest-backend; do
            test -f "${RELEASE_E2E_DIR}/${binary}"
            test -x "${RELEASE_E2E_DIR}/${binary}"
          done
          for asset in packages.json package_automation.json openapi-v1.yaml; do
            test -f "${RELEASE_E2E_DIR}/config/${asset}"
            test -s "${RELEASE_E2E_DIR}/config/${asset}"
          done
          test "$(cat "${RELEASE_E2E_DIR}/.version")" = "${VERSION_STAMP}"
          bash scripts/run_embedded_e2e.sh --binary "${RELEASE_E2E_DIR}/aetherflow-api" --static-dir "${RELEASE_E2E_DIR}/web/dist" --port 18080 --playwright

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist
          path: |
            release-dist/aetherflow-linux-*.tar.gz
            release-dist/aetherflow-bootstrap.tar.gz
            release-dist/speedtest-backend_*_linux_*.tar.gz
            release-dist/SHA256SUMS
          if-no-files-found: error

  release-arm64-runtime:
    name: Verify Extracted Release on ARM64
    needs: [validate-release, release-build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download Release Bundle Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: release-dist

      - name: Execute ARM64 Release Contracts
        env:
          VERSION_STAMP: ${{ needs.validate-release.outputs.version_stamp }}
          AETHERFLOW_SKIP_ENV_FILES: "1"
        run: |
          set -euo pipefail
          release_root="$(mktemp -d "${RUNNER_TEMP}/aetherflow-arm64.XXXXXX")"
          trap 'rm -rf "${release_root}"' EXIT
          mkdir "${release_root}/bundle" "${release_root}/standalone"
          (cd release-dist && sha256sum --strict --check SHA256SUMS)
          tar -xzf release-dist/aetherflow-linux-arm64.tar.gz -C "${release_root}/bundle"
          tar -xzf "release-dist/speedtest-backend_${VERSION_STAMP#v}_linux_arm64.tar.gz" -C "${release_root}/standalone"
          test "$(cat "${release_root}/bundle/.version")" = "${VERSION_STAMP}"
          timeout 30s "${release_root}/bundle/bin/af" --version | grep -F '(linux/aarch64)'
          timeout 30s "${release_root}/bundle/bin/speedtest-backend" --version
          timeout 30s "${release_root}/standalone/speedtest-backend" --version
          bash scripts/run_embedded_e2e.sh --binary "${release_root}/bundle/aetherflow-api" --static-dir "${release_root}/bundle/web/dist" --port 18080

  release-publish:
    name: Attest & Publish Signed Release
    if: github.ref == 'refs/heads/nightly' || github.ref == 'refs/heads/Nightly' || startsWith(github.ref, 'refs/tags/v')
    needs: [validate-release, security-gate, release-build, release-arm64-runtime]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Release Changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md

      - name: Download Release Bundle Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: release-dist

      - name: Verify Release Archive Integrity
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd release-dist
          expected=(aetherflow-linux-amd64.tar.gz)
          if [[ -s aetherflow-linux-arm64.tar.gz ]]; then
            expected+=(aetherflow-linux-arm64.tar.gz)
          fi
          if [[ -s aetherflow-bootstrap.tar.gz ]]; then
            expected+=(aetherflow-bootstrap.tar.gz)
          fi
          for arch in amd64 arm64 armv7; do
            expected+=("speedtest-backend_${RELEASE_TAG#v}_linux_${arch}.tar.gz")
          done
          for archive in "${expected[@]}"; do
            test -s "${archive}"
          done
          sha256sum "${expected[@]}" | cmp - SHA256SUMS

      - name: Attest Build Provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-dist/aetherflow-linux-*.tar.gz
            release-dist/aetherflow-bootstrap.tar.gz
            release-dist/speedtest-backend_*_linux_*.tar.gz
            release-dist/SHA256SUMS

      - name: Publish to GitHub Releases
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          ATTEST_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=(--generate-notes)
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            RELEASE_NOTES_FILE="$(mktemp)"
            trap 'rm -f "${RELEASE_NOTES_FILE}"' EXIT
            python3 - "${RELEASE_TAG}" "${GITHUB_SHA}" "${RELEASE_NOTES_FILE}" <<'PY'
          from pathlib import Path
          import sys

          release_tag, commit_sha, notes_file = sys.argv[1:]
          changelog = Path("CHANGELOG.md")
          if not changelog.is_file():
              raise SystemExit("A prerelease requires current patch notes in CHANGELOG.md.")
          notes = changelog.read_text(encoding="utf-8").split("\n---\n", 1)[0].strip()
          if not notes.startswith("## Nightly Patch Notes") or "\n" not in notes:
              raise SystemExit("The latest changelog section must contain nightly patch notes.")
          Path(notes_file).write_text(
              f"{notes}\n\nBuilt from commit `{commit_sha}` as `{release_tag}`.\n",
              encoding="utf-8",
          )
          PY
            RELEASE_FLAGS=(
              --prerelease
              --latest=false
              --notes-file "${RELEASE_NOTES_FILE}"
            )
          fi
          if [[ -z "${ATTEST_BUNDLE_PATH:-}" || ! -s "${ATTEST_BUNDLE_PATH}" ]]; then
            echo "::error::Missing or empty Sigstore attestation bundle from actions/attest-build-provenance" >&2
            exit 1
          fi
          RELEASE_ASSETS=(
            release-dist/aetherflow-linux-amd64.tar.gz
            release-dist/SHA256SUMS
          )
          cp -f "${ATTEST_BUNDLE_PATH}" release-dist/aetherflow-linux-amd64.tar.gz.sigstore.json
          RELEASE_ASSETS+=(release-dist/aetherflow-linux-amd64.tar.gz.sigstore.json)
          if [[ -s release-dist/aetherflow-linux-arm64.tar.gz ]]; then
            cp -f "${ATTEST_BUNDLE_PATH}" release-dist/aetherflow-linux-arm64.tar.gz.sigstore.json
            RELEASE_ASSETS+=(
              release-dist/aetherflow-linux-arm64.tar.gz
              release-dist/aetherflow-linux-arm64.tar.gz.sigstore.json
            )
          fi
          if [[ -s release-dist/aetherflow-bootstrap.tar.gz ]]; then
            cp -f "${ATTEST_BUNDLE_PATH}" release-dist/aetherflow-bootstrap.tar.gz.sigstore.json
            RELEASE_ASSETS+=(
              release-dist/aetherflow-bootstrap.tar.gz
              release-dist/aetherflow-bootstrap.tar.gz.sigstore.json
            )
          fi
          for arch in amd64 arm64 armv7; do
            extra_tar="release-dist/speedtest-backend_${RELEASE_TAG#v}_linux_${arch}.tar.gz"
            test -s "${extra_tar}"
            cp -f "${ATTEST_BUNDLE_PATH}" "${extra_tar}.sigstore.json"
            RELEASE_ASSETS+=("${extra_tar}" "${extra_tar}.sigstore.json")
          done
          gh release create "${RELEASE_TAG}" \
            "${RELEASE_ASSETS[@]}" \
            --target "${GITHUB_SHA}" \
            --title "AetherFlow ${RELEASE_TAG} (${GITHUB_SHA::8})" \
            "${RELEASE_FLAGS[@]}"
