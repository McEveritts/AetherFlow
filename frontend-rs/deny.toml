# AetherFlow v4 Rust Workspace Security, Advisory & Supply-Chain Policy
# Enforced in CI via `cargo deny --manifest-path frontend-rs/Cargo.toml check advisories bans licenses sources`
# and `cargo audit --file frontend-rs/Cargo.lock`.

[graph]
targets = [
    { triple = "wasm32-unknown-unknown" },
]
all-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Maintenance notice only: this macro dependency is required by Leptos.
# No vulnerability or unsoundness advisories are exempted.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is a build-time Leptos macro dependency; the advisory reports archival, with no vulnerability or safe upgrade" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Exact compatibility versions required by the locked transitive graph.
# New duplicate crates or versions remain denied. Advisory checks still apply.
skip = [
    { crate = "convert_case@=0.6.0", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "syn@=2.0.119", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "thiserror@=1.0.69", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "thiserror-impl@=1.0.69", reason = "Locked upstream dependencies require distinct API generations" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
