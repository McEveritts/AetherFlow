# AetherFlow v4 Rust Workspace Security, Advisory & Supply-Chain Policy
# Enforced in CI via `cargo deny --manifest-path backend-rs/Cargo.toml check advisories bans sources`
# and `cargo audit --file backend-rs/Cargo.lock --ignore ...`.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # RSA Marvin timing side-channel (RUSTSEC-2023-0071): rsa 0.9 is used strictly for
    # public-key JWT/OIDC signature verification (RS256 JWKS), never for PKCS#1v1.5 decryption
    # or private key operations where timing side-channels apply. No upstream fix exists in 0.9.x.
    { id = "RUSTSEC-2023-0071", reason = "rsa crate is used only for public-key OIDC/JWKS RS256 signature verification; private-key PKCS#1v1.5 decryption is never invoked." },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
