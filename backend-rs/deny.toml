# AetherFlow v4 Rust Workspace Security, Advisory & Supply-Chain Policy
# Enforced in CI via `cargo deny --manifest-path backend-rs/Cargo.toml check advisories bans licenses sources`
# and `cargo audit --file backend-rs/Cargo.lock`.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "armv7-unknown-linux-gnueabihf" },
]
all-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Maintenance notices only; no vulnerability or unsoundness advisories are exempted.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 maintenance notice (no vulnerability and no safe upstream upgrade path)" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz 0.10.4 maintenance notice (no vulnerability and no safe upstream upgrade path)" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Exact compatibility versions required by the locked transitive graph.
# New duplicate crates or versions remain denied. Advisory checks still apply.
skip = [
    { crate = "base64@=0.22.1", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "block-buffer@=0.10.4", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "cpufeatures@=0.2.17", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "crypto-common@=0.1.7", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "digest@=0.10.7", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "getrandom@=0.2.17", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "hmac@=0.12.1", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "lock_api@=0.4.14", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "miniz_oxide@=0.8.9", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "parking_lot@=0.12.5", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "parking_lot_core@=0.9.12", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "rand@=0.8.8", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "rand_core@=0.6.4", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "sha2@=0.10.9", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "signature@=2.2.0", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "syn@=2.0.119", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "thiserror@=1.0.69", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "thiserror-impl@=1.0.69", reason = "Locked upstream dependencies require distinct API generations" },
    { crate = "untrusted@=0.7.1", reason = "Locked upstream dependencies require distinct API generations" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
