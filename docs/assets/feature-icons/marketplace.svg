  <rect x="27" y="7" width="14" height="14" rx="3.5" fill="#22d3ee" fill-opacity="0.16" stroke="#38bdf8" stroke-width="2"/>
  <path d="M34 11 V17 M31 14 H37" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
  <!-- Interior detail accents -->
