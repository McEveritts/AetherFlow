  <!-- 3 catalog app tiles -->
  <rect x="7" y="7" width="14" height="14" rx="3.5" fill="url(#ic-mkt-fill)" stroke="url(#ic-mkt-stroke)" stroke-width="2"/>
  <rect x="7" y="27" width="14" height="14" rx="3.5" fill="url(#ic-mkt-fill)" stroke="url(#ic-mkt-stroke)" stroke-width="2"/>
  <rect x="27" y="27" width="14" height="14" rx="3.5" fill="url(#ic-mkt-fill)" stroke="url(#ic-mkt-stroke)" stroke-width="2"/>
