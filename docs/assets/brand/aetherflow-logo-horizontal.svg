<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128" role="img" aria-labelledby="af-logo-title">
  <title id="af-logo-title">AetherFlow</title>
  <defs>
    <linearGradient id="afl-peak" x1="24" y1="104" x2="104" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="afl-flow" x1="10" y1="0" x2="118" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="afl-word" x1="330" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <clipPath id="afl-left-half"><rect x="0" y="0" width="64" height="128"/></clipPath>
    <mask id="afl-cut-peak" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <path d="M12 82 C28 82 32 66 48 66 S72 82 88 78 S108 60 116 58" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round" clip-path="url(#afl-left-half)"/>
    </mask>
    <mask id="afl-cut-flow" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <path d="M64 26 L98 100" fill="none" stroke="#000" stroke-width="23"/>
    </mask>
  </defs>

  <!-- Mark -->
  <path d="M30 100 L64 26 L98 100" fill="none" stroke="url(#afl-peak)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" mask="url(#afl-cut-peak)"/>
  <path d="M12 82 C28 82 32 66 48 66 S72 82 88 78 S108 60 116 58" fill="none" stroke="url(#afl-flow)" stroke-width="10" stroke-linecap="round" mask="url(#afl-cut-flow)"/>
  <circle cx="116" cy="58" r="11" fill="#c084fc" fill-opacity="0.18"/>
  <circle cx="116" cy="58" r="6.5" fill="#c084fc"/>

  <!-- Wordmark (for dark backgrounds) -->
  <text x="146" y="84" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.6"><tspan fill="#f8fafc">Aether</tspan><tspan fill="url(#afl-word)">Flow</tspan></text>
</svg>
