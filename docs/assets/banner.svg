    <path d="M 44 82 L 66 82 C 78 82 84 74 84 62 L 84 44 C 84 34 90 30 100 30 L 112 30 L 112 44 L 99 44 C 95 44 94 46 94 50 L 94 60 L 109 60 L 109 73 L 94 73 L 94 98 L 79 98 L 79 79 C 74 82 68 83 61 83 L 44 83 Z" fill="#ffffff"/>
